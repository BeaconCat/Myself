<!doctype html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero 动效实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!--
================================================================================
 Myself · Hero 动效实验室（design/round2/hero-motion）
================================================================================
 目的：在 1:1 还原的首页 Hero（左：标签 + 宋体大标题 + 摘要 + 阅读按钮；右：3 张叠放
 的 3D 封面卡 + 进度胶囊）上，对比 8 组「文章切换」编舞。每组 = 文字出/入 + 卡组出/入
 + 背景光响应，是一段连贯叙事。

 ── 落地映射（Vue）──────────────────────────────────────────────────────────────
 · 每组编舞是一个纯对象 { name, idea, exit(els, t), enter(els, t) }，只依赖 Web Animations
   API。落地为 composable：useHeroChoreo(choreo) → swap(oldEls, newEls) 返回 Promise。
   HeroText / HeroDeck 各自 defineExpose 一个 els() 采集函数即可，不需要 phase 类名状态机。
 · 切换时「新旧两套 DOM 同时在场」：HeroCarousel 以 <TransitionGroup :css="false">
   或手动双缓冲（v-for 两个 slide，key=itemIndex）渲染，@leave/@enter 钩子里调用
   exit/enter，done 在 master 动画 finished 后回调。
 · 所有 enter 关键帧的终点 = 静止态（槽位 transform / filter），结束时 cancel() 即可
   无缝回到 CSS 控制，不残留 fill，不影响后续的组内轮转。

 ── DOM 结构要求（els 采集）─────────────────────────────────────────────────────
   .slide（整幅 Hero 一层，新旧两层叠放；无 z-index，卡片 z 可跨层交错）
     .slide-bg                         每篇文章自己的环境光（--tint）
     .h-text > .h-tag / .h-title / .h-excerpt / .h-btn
       .h-title > .ln > .ln-in > .w > .ch   拆行 + 拆字（行=测量 offsetTop 后分组）
       .h-excerpt > .ln > .ln-in > .w > .ch 同上（摘要主要按行用）
     .album > .card(槽位 3D 变换 / z) > .sheet(圆角裁切 / 开合 / clip-path) > .cv(画面) + .sheen
   现有 HeroText 只拆了字（.word > .char），需要补一步 useLineSplit()：挂载后按
   offsetTop 分组包 .ln/.ln-in 并设 nowrap（字距动画不引发重排）；resize 时重拆。
   现有 HeroDeck 的 .album-card 需拆成 card(变换) 与 sheet(外观) 两层，img 包进 .cv。

 ── 缓动曲线（命名 + 选择理由）──────────────────────────────────────────────────
   expoOut    cubic-bezier(.16,1,.3,1)  入场主力。前 30% 时间走完 ~80% 路程：新内容很快
                                        「可读」，再用长尾慢慢落定，有被放下的重量感。
   quartIn    cubic-bezier(.5,0,.75,0)  出场主力。从静止平滑起步、持续加速离开：不会
                                        在第一帧跳走，也不在离场时拖泥带水抢注意力。
   quartInOut cubic-bezier(.76,0,.24,1) 穿越画面的位移（FLIP 飞行、光带扫描）：两端
                                        都有「出发/抵达」，中段最快，眼睛跟得住。
   spring     linear(…) 阻尼比 ζ=.62    物理感：晋升、落位，约 8% 过冲一次即稳。
   springPop  linear(…) 阻尼比 ζ=.42    字符弹入，约 23% 过冲，更俏皮。
              （linear() 不支持时回退到品牌 --ease-spring）
   另保留品牌 token --ease-out(.2,.8,.3,1) 给 UI 微交互。
   规则：总切换 900–1600ms；出场 ≤ 入场（出场 ~350–700ms，入场 ~800–1100ms），且入场在
   出场 60–80% 处开始重叠，避免「空一拍」。

 ── reduced-motion 降级 ─────────────────────────────────────────────────────────
   所有方案统一退化为纯 crossfade：旧 slide 200ms 淡出 + 新 slide 260ms 淡入（重叠 120ms），
   不做位移 / 缩放 / 模糊 / 3D；组内轮转瞬切。控制条可模拟开关；系统设置会自动开启。

 ── Tokens ──────────────────────────────────────────────────────────────────────
   颜色 --bg/--surface/--text* 按 data-mode 切换；--primary/--primary-deep 为色盘
   （@property 注册，切色盘时 600ms 平滑过渡）。品牌信号三色 --sig-red/yellow/blue 只用于
   时间轴图层条分组（出场/入场/光）。动效 --dur-fast .2s --dur .35s --dur-slow .6s。
================================================================================
-->
<style>
@property --primary { syntax: '<color>'; inherits: true; initial-value: #0078ff; }
@property --primary-deep { syntax: '<color>'; inherits: true; initial-value: #0056c7; }

:root {
  --sig-red: #ff0032; --sig-yellow: #ffb300; --sig-blue: #0078ff;
  --primary: #0078ff; --primary-deep: #0056c7;
  --dur-fast: .2s; --dur: .35s; --dur-slow: .6s;
  --ease-out: cubic-bezier(.2,.8,.3,1);
  --ease-spring: cubic-bezier(.2,.8,.3,1.2);
  --radius-lg: 18px; --radius-xl: 28px;
  --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  transition: --primary .6s var(--ease-out), --primary-deep .6s var(--ease-out);
}
:root, :root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #0a101c;
  --bg-2: #0d1526;
  --surface: #111a2c;
  --surface-2: #17223a;
  --border: rgba(150, 175, 220, .13);
  --border-2: rgba(150, 175, 220, .22);
  --text: #e9eef8;
  --text-2: #9aa8c0;
  --text-3: #66758f;
  --hero-bg: linear-gradient(170deg, #0c1629 0%, #0a1323 55%, #09101d 100%);
  --hero-edge: rgba(120, 160, 230, .12);
  --glass: rgba(18, 27, 46, .66);
  --shadow-card: 0 34px 60px -26px rgba(0, 0, 0, .75);
  --lit: #ffffff;
}
:root[data-mode="light"] {
  color-scheme: light;
  --bg: #eef1f7;
  --bg-2: #e6eaf2;
  --surface: #ffffff;
  --surface-2: #f2f5fa;
  --border: rgba(20, 40, 80, .10);
  --border-2: rgba(20, 40, 80, .18);
  --text: #0e1a2f;
  --text-2: #4c5b74;
  --text-3: #8391a8;
  --hero-bg: linear-gradient(170deg, #ffffff 0%, #f6f8fc 60%, #eef2f9 100%);
  --hero-edge: rgba(20, 50, 110, .08);
  --glass: rgba(255, 255, 255, .72);
  --shadow-card: 0 30px 50px -24px rgba(12, 28, 60, .45);
  --lit: var(--primary);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background var(--dur) ease, color var(--dur) ease;
}
button { font: inherit; color: inherit; cursor: pointer; }
::selection { background: color-mix(in srgb, var(--primary) 35%, transparent); }

/* view-transition：深浅切换用圆形揭示 */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

.page { max-width: 1400px; margin: 0 auto; padding: 22px 24px 150px; }

/* ── 顶栏 ─────────────────────────────────── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: #0b1426; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.mark::before, .mark::after { content: ''; position: absolute; top: 7px; bottom: 9px; width: 6px; }
.mark::before { left: 9px; background: #fff; clip-path: polygon(0 0, 100% 12%, 100% 88%, 0 100%); }
.mark::after { left: 16px; background: var(--sig-blue); clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 88%); }
.brand b { font-family: var(--font-serif); font-size: 17px; letter-spacing: .02em; }
.brand span { color: var(--text-3); font-size: 13px; margin-left: 4px; }
.keys { display: flex; gap: 14px; color: var(--text-3); font-size: 12px; }
.keys kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border-2); color: var(--text-2); margin-right: 4px; }

/* ── Hero 舞台 ─────────────────────────────── */
.hero {
  position: relative;
  height: clamp(560px, 66vh, 660px);
  border-radius: var(--radius-xl);
  overflow: hidden;
  isolation: isolate;
  background: var(--hero-bg);
  border: 1px solid var(--hero-edge);
  box-shadow: 0 40px 80px -50px rgba(0, 0, 0, .6);
  user-select: none;
}
.hero-ambient {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(55% 60% at 78% 40%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 70%),
    radial-gradient(40% 50% at 8% 100%, color-mix(in srgb, var(--primary) 6%, transparent), transparent 70%);
}
.slides { position: absolute; inset: 0; }
.slide {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  align-items: center;
  gap: 48px;
  padding: 0 64px 0 80px;
}
.slide-bg {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42% 58% at 74% 46%, color-mix(in srgb, var(--tint) 24%, transparent), transparent 72%),
    radial-gradient(30% 36% at 16% 78%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 72%);
}
:root[data-mode="light"] .slide-bg { opacity: .7; }

.h-text { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.h-tag {
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  padding: 4px 12px; border-radius: 999px;
  color: var(--primary);
  background: color-mix(in srgb, var(--primary) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
}
.h-title {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: clamp(34px, 4.1vw, 58px);
  line-height: 1.2;
  letter-spacing: 0;
}
.h-excerpt { margin: 0; font-size: 16px; line-height: 1.8; color: var(--text-2); max-width: 30em; }
.ln { display: block; position: relative; padding: .08em 0 .12em; margin: -.08em 0 -.12em; }
.ln-in { display: inline-block; white-space: nowrap; transform-origin: 0 60%; }
.w { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; white-space: pre; }
.sp { white-space: pre; }
.h-btn {
  margin-top: 6px;
  font-size: 15px; font-weight: 700; letter-spacing: .04em;
  padding: 12px 32px; border-radius: 12px; border: none; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.35);
  background: linear-gradient(180deg, var(--primary), var(--primary-deep));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 42%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
  transition: transform var(--dur-fast) var(--ease-out), filter var(--dur-fast);
}
.h-btn:hover { transform: scale(1.04); filter: brightness(1.08); }

.h-deckcol { display: flex; flex-direction: column; align-items: center; }
.album { position: relative; width: min(100%, clamp(400px, 34vw, 540px)); aspect-ratio: 4 / 3; }
.pill-ph { height: 9px; margin-top: 64px; }
.card { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
.sheet {
  position: absolute; inset: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #050a14;
  box-shadow: var(--shadow-card), 0 30px 70px -22px color-mix(in srgb, var(--primary) 32%, transparent);
  outline: 1px solid rgba(255,255,255,.07); outline-offset: -1px;
}
.sheen {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(120deg, transparent 30%, rgba(255,255,255,.12) 48%, transparent 62%),
    linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--primary) 16%, transparent));
}

/* ── 常驻 chrome：进度胶囊 / 缩略导航 ───────── */
.chrome { position: absolute; inset: 0; z-index: 46; pointer-events: none; }
.pills, .rail { pointer-events: auto; }
.pills { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; height: 9px; transition: opacity var(--dur) ease; }
.pill { position: relative; width: 9px; height: 9px; border-radius: 99px; border: 0; padding: 0; background: var(--border-2); overflow: hidden; transition: width var(--dur) var(--ease-out), background var(--dur-fast); }
.pill.on { width: 52px; background: color-mix(in srgb, var(--text) 12%, transparent); }
.pill i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-deep)); box-shadow: 0 0 8px color-mix(in srgb, var(--primary) 55%, transparent); }
/* 定位由 JS 按当前 slide 的相册底边计算（移动端文字高度不定），切换时平滑跟随 */
.rail-wrap { position: absolute; width: 0; height: 0; transition: top var(--dur-slow) var(--ease-out), left var(--dur-slow) var(--ease-out); }
.rail {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  display: flex; gap: 10px; padding: 6px; border-radius: 14px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
  opacity: 0; pointer-events: none; transition: opacity var(--dur) ease;
}
.hero.has-rail .rail { opacity: 1; pointer-events: auto; }
.hero.has-rail .pills { opacity: 0; pointer-events: none; }
.thumb { position: relative; width: 60px; height: 45px; border-radius: 8px; overflow: hidden; border: 0; padding: 0; background: #050a14; }
.thumb .cv { transform: none; }
.thumb::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.rail-ind { position: absolute; left: 6px; top: 6px; width: 60px; height: 45px; border-radius: 8px; box-shadow: 0 0 0 2px var(--primary), 0 0 16px color-mix(in srgb, var(--primary) 60%, transparent); pointer-events: none; z-index: 2; }

.hover-hint {
  position: absolute; top: 18px; right: 20px; z-index: 47;
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-2);
  padding: 5px 10px 5px 8px; border-radius: 99px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  opacity: 0; transform: translateY(-6px); transition: opacity var(--dur) ease, transform var(--dur) var(--ease-out);
  pointer-events: none;
}
.hover-hint svg { width: 14px; height: 14px; }
.hero.hovering .hover-hint { opacity: 1; transform: none; }

/* ── 编舞用的光效层（默认全透明，静止态不可见）── */
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx > * { position: absolute; opacity: 0; pointer-events: none; }
.fx-flare { z-index: 8; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--primary) 55%, #fff 20%), color-mix(in srgb, var(--primary) 18%, transparent) 55%, transparent); filter: blur(10px); }
.fx-floor {
  z-index: 4;
  background: linear-gradient(196deg, rgba(235,244,255,.62) 0%, color-mix(in srgb, var(--primary) 26%, transparent) 42%, transparent 78%);
  clip-path: polygon(80% 0, 100% 0, 58% 100%, 0 100%);
  filter: blur(10px);
  transform-origin: 90% 0;
}
:root[data-mode="light"] .fx-floor { background: linear-gradient(196deg, color-mix(in srgb, var(--primary) 40%, #fff) 0%, color-mix(in srgb, var(--primary) 18%, transparent) 42%, transparent 78%); }
.fx-band {
  z-index: 60; top: -20%; height: 140%; left: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    color-mix(in srgb, var(--primary) 16%, transparent) 26%,
    color-mix(in srgb, var(--primary) 55%, #fff 10%) 46%,
    rgba(255,255,255,.95) 50%,
    color-mix(in srgb, var(--primary) 55%, #fff 10%) 54%,
    color-mix(in srgb, var(--primary) 16%, transparent) 74%,
    transparent 100%);
  mix-blend-mode: plus-lighter;
}
:root[data-mode="light"] .fx-band { mix-blend-mode: normal; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--primary) 10%, transparent) 30%, color-mix(in srgb, var(--primary) 45%, #fff) 49%, #fff 50%, color-mix(in srgb, var(--primary) 45%, #fff) 51%, color-mix(in srgb, var(--primary) 10%, transparent) 70%, transparent); }
.fx-vig { z-index: 59; inset: 0; background: radial-gradient(75% 75% at 60% 50%, transparent 40%, rgba(2,5,12,.72) 100%); }
:root[data-mode="light"] .fx-vig { background: radial-gradient(75% 75% at 60% 50%, transparent 40%, rgba(40,60,100,.22) 100%); }

/* 编舞临时元素（由 t.make 创建，结束即移除） */
.glint-track { position: absolute; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }
.glint { position: absolute; top: 10%; bottom: 8%; left: 0; width: 64px; background: linear-gradient(90deg, transparent 20%, color-mix(in srgb, var(--primary) 38%, transparent) 44%, rgba(255,255,255,.7) 50%, color-mix(in srgb, var(--primary) 38%, transparent) 56%, transparent 80%); mix-blend-mode: screen; filter: blur(2px); }
:root[data-mode="light"] .glint { mix-blend-mode: multiply; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--primary) 35%, transparent) 42%, var(--primary) 50%, color-mix(in srgb, var(--primary) 35%, transparent) 58%, transparent); }
.slit-edge { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; z-index: 3; }
.slit-line { position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; border-radius: 2px; background: #fff; box-shadow: 0 0 10px 2px color-mix(in srgb, var(--primary) 80%, #fff), 0 0 36px 10px color-mix(in srgb, var(--primary) 45%, transparent); }
.page-shade { position: absolute; inset: 0; z-index: 4; background: linear-gradient(90deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.55)); pointer-events: none; }
.page-back { position: absolute; inset: 0; border-radius: var(--radius-lg); transform-origin: 0 50%;
  background: linear-gradient(270deg, #7d8aa3 0%, #c8d1e0 12%, #eef2f8 55%, #f8fafd 100%);
  box-shadow: var(--shadow-card); }
.page-back::after { content: ''; position: absolute; inset: 14% 14%; background: repeating-linear-gradient(180deg, transparent 0 11px, rgba(60,80,120,.12) 11px 12px); }
.page-cast { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.7), rgba(0,0,0,.25) 45%, transparent 80%); }
.leaf { position: absolute; inset: 0; }
.baseline { position: absolute; height: 2px; bottom: .1em; border-radius: 2px; background: linear-gradient(90deg, var(--primary), color-mix(in srgb, var(--primary) 20%, transparent)); }

/* ── 封面：CSS 光影构成（按 % 定位，缩略图同样适配）── */
.cv { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 112%, #0d2247 0%, #050c1a 58%, #02050c 100%); }
.cv i { position: absolute; display: block; }

/* 门：左白页 + 右钴蓝页 + 地面透光（呼应 logo） */
.cv-door .halo { inset: 8% 22% 18%; background: radial-gradient(closest-side, rgba(90,150,255,.35), transparent); filter: blur(8px); }
.cv-door .leaf-l { left: 30%; top: 15%; width: 19%; height: 63%; border-radius: 3% ; background: linear-gradient(180deg, #ffffff, #e6ecf6 60%, #b8c6de); clip-path: polygon(0 3%, 100% 11%, 100% 89%, 0 100%); }
.cv-door .leaf-r { left: 51%; top: 15%; width: 19%; height: 63%; background: linear-gradient(165deg, #3a95ff, #0b5ee0 55%, #0842a8); clip-path: polygon(0 11%, 100% 0, 100% 97%, 0 89%); }
.cv-door .gap { left: 49%; top: 22%; width: 2%; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(200,225,255,.95)); filter: blur(2px); }
.cv-door .floor { left: 6%; right: 6%; top: 70%; bottom: -4%; background: linear-gradient(180deg, rgba(225,238,255,.9), rgba(120,170,255,.28) 55%, transparent); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter: blur(5px); }

/* 门缝：黑暗中一道竖光 + 光扇 */
.cv-slit { background: radial-gradient(60% 80% at 50% 50%, #0a1830 0%, #03060d 70%); }
.cv-slit .wall { inset: 0; background: radial-gradient(18% 55% at 50% 42%, rgba(80,140,255,.28), transparent 70%); }
.cv-slit .line { left: 49.6%; top: 12%; width: .8%; height: 60%; background: linear-gradient(180deg, rgba(255,255,255,.3), #fff 30%, #fff); box-shadow: 0 0 10px 2px rgba(170,205,255,.9), 0 0 42px 10px rgba(0,120,255,.55); border-radius: 2px; }
.cv-slit .fan { left: 0; right: 0; top: 71%; bottom: 0; background: linear-gradient(180deg, rgba(235,244,255,.85), rgba(80,140,255,.2) 60%, transparent); clip-path: polygon(49.3% 0, 50.7% 0, 88% 100%, 12% 100%); filter: blur(3px); }
.cv-slit .dust { inset: 0; background-image: radial-gradient(1px 1px at 46% 30%, rgba(255,255,255,.7), transparent), radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,.5), transparent), radial-gradient(1.5px 1.5px at 52% 22%, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 44% 60%, rgba(255,255,255,.4), transparent); }

/* 体积光带：高窗斜射 */
.cv-beams { background: linear-gradient(160deg, #0b1a33 0%, #050b18 60%, #03060d 100%); }
.cv-beams .win { left: 10%; top: 6%; width: 16%; height: 22%; background: linear-gradient(135deg, #fff, #cfe0ff); box-shadow: 0 0 30px 8px rgba(160,200,255,.5); transform: skewY(-6deg); }
.cv-beams .b { left: -10%; top: 10%; width: 150%; height: 13%; transform-origin: 0 50%; background: linear-gradient(90deg, rgba(230,240,255,.55), rgba(120,170,255,.12) 60%, transparent); filter: blur(7px); mix-blend-mode: screen; }
.cv-beams .b1 { transform: rotate(28deg); }
.cv-beams .b2 { transform: rotate(35deg); top: 16%; height: 9%; opacity: .7; }
.cv-beams .b3 { transform: rotate(22deg); top: 4%; height: 7%; opacity: .55; }
.cv-beams .pool { right: 4%; bottom: 6%; width: 58%; height: 26%; border-radius: 50%; background: radial-gradient(closest-side, rgba(210,228,255,.55), rgba(0,120,255,.12) 60%, transparent); filter: blur(4px); }

/* 四季光晕 */
.cv-season { background: radial-gradient(90% 90% at 50% 50%, #0d1424, #04060c); }
.cv-season .o { width: 46%; aspect-ratio: 1; border-radius: 50%; filter: blur(16px); mix-blend-mode: screen; opacity: .85; }
.cv-season .o1 { left: 12%; top: 12%; background: radial-gradient(closest-side, #00c853, transparent); }
.cv-season .o2 { left: 42%; top: 6%; background: radial-gradient(closest-side, #ff0032, transparent); }
.cv-season .o3 { left: 18%; top: 44%; background: radial-gradient(closest-side, #ffb300, transparent); }
.cv-season .o4 { left: 46%; top: 40%; background: radial-gradient(closest-side, #0078ff, transparent); }
.cv-season .disc { left: 30%; top: 17%; width: 40%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(255,255,255,.04) 45%, rgba(0,0,0,.25)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 20px 40px rgba(0,0,0,.4); }
.cv-season .half { left: 30%; top: 17%; width: 40%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(90deg, rgba(255,255,255,.18) 50%, rgba(0,0,0,.35) 50%); mix-blend-mode: overlay; }

/* 光谱弧 */
.cv-arcs { background: radial-gradient(80% 90% at 50% 100%, #10213f, #03060d 70%); }
.cv-arcs .a { left: 50%; top: 100%; border-radius: 50%; border-style: solid; border-color: transparent; transform: translate(-50%, -50%); }
.cv-arcs .a1 { width: 44%; aspect-ratio: 1; border-width: 5px; border-top-color: #ff0032; border-left-color: #ff0032; filter: drop-shadow(0 0 8px rgba(255,0,50,.6)); transform: translate(-50%,-50%) rotate(8deg); }
.cv-arcs .a2 { width: 66%; aspect-ratio: 1; border-width: 5px; border-top-color: #ffb300; border-right-color: #ffb300; filter: drop-shadow(0 0 8px rgba(255,179,0,.55)); transform: translate(-50%,-50%) rotate(-12deg); }
.cv-arcs .a3 { width: 90%; aspect-ratio: 1; border-width: 5px; border-top-color: #0078ff; border-left-color: #0078ff; filter: drop-shadow(0 0 10px rgba(0,120,255,.7)); transform: translate(-50%,-50%) rotate(30deg); }
.cv-arcs .sun { left: 50%; bottom: -6%; width: 22%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(closest-side, #fff, rgba(255,255,255,.5) 40%, rgba(0,120,255,.2) 70%, transparent); }

/* 书页：摊开的书 + 斜射一道光 */
.cv-page { background: radial-gradient(90% 80% at 50% 40%, #13213b, #05090f 75%); }
.cv-page .pg { top: 20%; width: 34%; height: 60%; background: linear-gradient(90deg, #cfd8e6, #f4f7fb 70%, #e6ebf3); }
.cv-page .pg::after { content: ''; position: absolute; inset: 14% 12% 18%; background: repeating-linear-gradient(180deg, transparent 0 7px, rgba(40,60,100,.2) 7px 8px); }
.cv-page .pl { left: 16%; transform: perspective(500px) rotateY(16deg); transform-origin: 100% 50%; }
.cv-page .pr { left: 50%; transform: perspective(500px) rotateY(-16deg); transform-origin: 0 50%; background: linear-gradient(270deg, #cfd8e6, #f4f7fb 70%, #e9eef5); }
.cv-page .spine { left: 49.4%; top: 19%; width: 1.2%; height: 62%; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.05), rgba(0,0,0,.35)); }
.cv-page .ray { left: -20%; top: -30%; width: 60%; height: 170%; transform: rotate(-28deg); background: linear-gradient(90deg, transparent, rgba(200,225,255,.22) 45%, rgba(255,255,255,.35) 50%, rgba(200,225,255,.22) 55%, transparent); filter: blur(6px); mix-blend-mode: screen; }
.cv-page .mark { left: 60%; top: 17%; width: 3%; height: 26%; background: linear-gradient(180deg, #0078ff, #0050c0); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }
.cv-page .shadow { left: 12%; right: 12%; top: 78%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); }

/* 信号塔：红蓝同心弧 + 灯 */
.cv-signal { background: radial-gradient(80% 80% at 50% 70%, #0f1e3a, #03060d 72%); }
.cv-signal .arc { top: 50%; border-radius: 50%; border: 5px solid transparent; transform: translate(-50%, -50%); left: 50%; }
.cv-signal .r1 { width: 26%; aspect-ratio: 1; border-left-color: #ff3355; border-right-color: #ff3355; filter: drop-shadow(0 0 6px rgba(255,0,50,.6)); }
.cv-signal .r2 { width: 44%; aspect-ratio: 1; border-left-color: #d42a45; border-right-color: #d42a45; opacity: .9; }
.cv-signal .r3 { width: 64%; aspect-ratio: 1; border-left-color: #1a6fff; border-right-color: #1a6fff; filter: drop-shadow(0 0 8px rgba(0,120,255,.6)); }
.cv-signal .r4 { width: 86%; aspect-ratio: 1; border-left-color: #0a4fc0; border-right-color: #0a4fc0; opacity: .7; }
.cv-signal .tower { left: 45%; top: 52%; width: 10%; height: 44%; background: linear-gradient(90deg, #8594ad, #c9d3e3 50%, #8594ad); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
.cv-signal .lamp { left: 50%; top: 50%; width: 9%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff, #ffe6a0 45%, rgba(255,179,0,.2) 70%, transparent); box-shadow: 0 0 30px 10px rgba(255,200,80,.35); }

/* 钥匙孔：APIKey 的光 */
.cv-key { background: radial-gradient(70% 70% at 50% 45%, #111e36, #04070d 70%); }
.cv-key .plate { left: 33%; top: 12%; width: 34%; height: 76%; border-radius: 14px; background: linear-gradient(160deg, #1d2a42, #0b1220); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.5); }
.cv-key .spill { left: 20%; top: 18%; width: 60%; height: 60%; background: radial-gradient(closest-side, rgba(0,120,255,.35), transparent); filter: blur(10px); }
.cv-key .hole { left: 50%; top: 32%; width: 10%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); background: #fff; box-shadow: 0 0 14px 3px rgba(190,215,255,.9), 0 0 50px 14px rgba(0,120,255,.5); }
.cv-key .slot { left: 50%; top: 42%; width: 7%; height: 20%; transform: translateX(-50%); background: linear-gradient(180deg, #fff, #dbe8ff); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); box-shadow: 0 0 20px rgba(190,215,255,.8); }
.cv-key .beam { left: 30%; right: 30%; top: 62%; bottom: 0; background: linear-gradient(180deg, rgba(220,235,255,.5), transparent); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); filter: blur(4px); }

/* 光栅地平线：数据在光里流动 */
.cv-grid { background: linear-gradient(180deg, #03060d 0%, #081328 52%, #0a1a38 53%, #03060d 100%); }
.cv-grid .floor { left: -30%; right: -30%; top: 53%; height: 90%; transform: perspective(220px) rotateX(62deg); transform-origin: 50% 0; background-image: linear-gradient(rgba(0,120,255,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(0,120,255,.55) 1px, transparent 1px); background-size: 7% 12%; -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); mask-image: linear-gradient(180deg, #000, transparent 70%); }
.cv-grid .horizon { left: 0; right: 0; top: 52%; height: 2%; background: linear-gradient(90deg, transparent, #7fb3ff 30%, #fff 50%, #7fb3ff 70%, transparent); filter: blur(1px); box-shadow: 0 0 30px 6px rgba(0,120,255,.5); }
.cv-grid .sun { left: 50%; top: 52%; width: 38%; aspect-ratio: 2; border-radius: 999px 999px 0 0; transform: translate(-50%, -100%); background: linear-gradient(180deg, #ff0032, #ff7a1a 60%, #ffb300); -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 9%, transparent 9% 12%); mask-image: repeating-linear-gradient(180deg, #000 0 9%, transparent 9% 12%); opacity: .9; }
.cv-grid .pkt { left: 62%; top: 70%; width: 5%; height: 3%; background: #fff; box-shadow: 0 0 12px 4px rgba(120,180,255,.9); transform: skewX(-30deg); }

/* ── 说明条 ─────────────────────────────────── */
.cap { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: start; margin: 26px 8px 0; }
.cap-no { font-family: var(--font-serif); font-weight: 900; font-size: 64px; line-height: .9; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 1px var(--border-2); position: relative; min-width: 1.4em; }
.cap-no b { position: absolute; inset: 0; color: var(--primary); -webkit-text-stroke: 0; clip-path: inset(0 0 0 0); font-weight: 900; }
.cap-body h2 { margin: 2px 0 8px; font-family: var(--font-serif); font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.cap-body p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.75; max-width: 62ch; }
.cap-body .cap-dom { margin-top: 8px; font-size: 12.5px; color: var(--text-3); line-height: 1.7; }
.cap-body .cap-dom code { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2); }
.cap-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 4px; }
.chip { font-size: 12.5px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border-2); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip:empty { display: none; }
.chip.accent { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, transparent); background: color-mix(in srgb, var(--primary) 9%, transparent); font-weight: 700; }
.chip .m { font-family: var(--font-mono); font-size: 12px; color: var(--text); }

/* ── 时间轴（AE 图层条）─────────────────────── */
.tl-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease-out), opacity var(--dur) ease, margin var(--dur-slow) var(--ease-out); margin-top: 22px; }
.tl-wrap.off { grid-template-rows: 0fr; opacity: 0; margin-top: 0; }
.tl-wrap > div { overflow: hidden; }
.tl { border-radius: 20px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 16px 18px 12px; }
.tl-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--text-2); }
.tl-head b { color: var(--text); font-weight: 700; font-size: 14px; }
.tl-head .sum { font-variant-numeric: tabular-nums; }
.legend { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--text-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tl-grid { position: relative; --lab: 210px; --easew: 92px; cursor: ew-resize; touch-action: none; }
.tl-ruler, .tl-row { display: grid; grid-template-columns: var(--lab) 1fr var(--easew); align-items: center; }
.tl-ruler { height: 22px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.tl-ruler .ticks { position: relative; height: 100%; border-bottom: 1px solid var(--border); }
.tl-ruler .ticks span { position: absolute; bottom: 4px; transform: translateX(-50%); }
.tl-ruler .ticks span::after { content: ''; position: absolute; left: 50%; top: 100%; height: 4px; width: 1px; background: var(--border-2); margin-top: 4px; }
.tl-row { height: 24px; font-size: 12px; }
.tl-row:nth-child(even) .track { background: color-mix(in srgb, var(--text) 2.5%, transparent); }
.tl-row .lbl { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; display: flex; align-items: center; gap: 8px; }
.tl-row .lbl i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.tl-row .track { position: relative; height: 100%; }
.tl-row .bar { position: absolute; top: 6px; height: 12px; border-radius: 4px; opacity: .9; }
.tl-row .bar .tk { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.55); }
.tl-row .ease { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); padding-left: 12px; white-space: nowrap; }
.g-out { background: var(--sig-red); } .g-in { background: var(--sig-blue); } .g-fx { background: var(--sig-yellow); }
.bar.g-out { background: linear-gradient(90deg, color-mix(in srgb, var(--sig-red) 70%, transparent), var(--sig-red)); }
.bar.g-in { background: linear-gradient(90deg, color-mix(in srgb, var(--sig-blue) 70%, transparent), var(--sig-blue)); }
.bar.g-fx { background: linear-gradient(90deg, color-mix(in srgb, var(--sig-yellow) 70%, transparent), var(--sig-yellow)); }
.tl-cursor { position: absolute; top: 0; bottom: 0; width: 0; left: calc(var(--lab) + (100% - var(--lab) - var(--easew)) * var(--p, 0)); pointer-events: none; }
.tl-cursor::before { content: ''; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--text); opacity: .85; }
.tl-cursor::after { content: attr(data-t); position: absolute; top: -2px; left: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--bg); background: var(--text); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.tl-foot { margin-top: 10px; font-size: 12px; color: var(--text-3); }

/* ── 控制条（毛玻璃胶囊）─────────────────────── */
.bar-dock { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; z-index: 100; padding: 0 12px; pointer-events: none; }
.ctl {
  pointer-events: auto;
  display: flex; align-items: center; gap: 6px;
  padding: 7px; border-radius: 999px;
  max-width: 100%; overflow-x: auto; scrollbar-width: none;
  background: var(--glass);
  border: 1px solid var(--border-2);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
}
.ctl::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 22px; background: var(--border-2); flex: none; margin: 0 4px; }
.seg { position: relative; display: flex; flex: none; padding: 2px; border-radius: 99px; background: color-mix(in srgb, var(--text) 5%, transparent); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 11px; border-radius: 99px; font-size: 13px; color: var(--text-2); white-space: nowrap; transition: color var(--dur-fast) ease; }
.seg button b { font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; margin-right: 5px; opacity: .7; }
.seg button[aria-pressed="true"] { color: #fff; }
.seg button:not([aria-pressed="true"]):hover { color: var(--text); }
.seg-ind { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 99px; background: linear-gradient(180deg, var(--primary), var(--primary-deep)); box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 45%, transparent); transition: transform var(--dur) var(--ease-spring), width var(--dur) var(--ease-spring); }
.ib { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--text-2); transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out); }
.ib:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
.ib:active { transform: scale(.92); }
.ib svg { width: 20px; height: 20px; }
.ib.play { background: var(--text); color: var(--bg); }
.ib.play:hover { background: var(--text); color: var(--bg); transform: scale(1.06); }
.pal { display: flex; gap: 6px; flex: none; padding: 0 4px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: var(--c); box-shadow: 0 0 0 0 var(--c); transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur) var(--ease-out); }
.dot:hover { transform: scale(1.15); }
.dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
.tg { flex: none; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px 6px 6px; border-radius: 99px; font-size: 13px; color: var(--text-2); white-space: nowrap; transition: background var(--dur-fast); }
.tg:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
.sw { position: relative; width: 30px; height: 18px; border-radius: 99px; background: var(--border-2); transition: background var(--dur) ease; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform var(--dur) var(--ease-spring); }
.tg[aria-pressed="true"] .sw { background: var(--primary); }
.tg[aria-pressed="true"] .sw::after { transform: translateX(12px); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ── 响应式：≤900 与现站一致，上下布局 ────────── */
@media (max-width: 900px) {
  .page { padding: 14px 12px 150px; }
  .keys { display: none; }
  .hero { height: 720px; }
  .slide { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 30px; padding: 30px 22px; }
  .h-text { align-items: center; text-align: center; }
  .h-title { font-size: clamp(26px, 7vw, 36px); min-height: 0; }
  .h-excerpt { font-size: 14.5px; }
  .ln-in { transform-origin: 50% 60%; }
  .album { width: min(100% - 92px, 300px); }
  .pill-ph { margin-top: 44px; }
  .brand span { display: none; }
  .cap { grid-template-columns: auto 1fr; }
  .cap-meta { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .cap-no { font-size: 48px; }
  .tl-grid { --lab: 120px; --easew: 0px; }
  .tl-row .ease { display: none; }
  .seg button span { display: none; }
  .seg button b { margin-right: 0; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: .01s; --dur: .01s; --dur-slow: .01s; }
}
:root[data-reduced="1"] { --dur-fast: .01s; --dur: .01s; --dur-slow: .01s; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Hero 动效实验室</b><span>Myself · 8 组切换编舞 · Web Animations API</span></div>
    <div class="keys"><span><kbd>←</kbd><kbd>→</kbd>切换文章</span><span><kbd>1</kbd>–<kbd>8</kbd>方案</span><span><kbd>空格</kbd>暂停</span><span>悬停舞台暂停轮播</span></div>
  </header>

  <section class="hero" id="hero" aria-roledescription="carousel" aria-label="首页 Hero">
    <div class="hero-ambient"></div>
    <div class="slides" id="slides"></div>
    <div class="fx" id="fx">
      <div class="fx-flare"></div><div class="fx-floor"></div><div class="fx-band"></div><div class="fx-vig"></div>
    </div>
    <div class="chrome">
      <div class="rail-wrap" id="railWrap">
        <div class="pills" id="pills"></div>
        <div class="rail" id="rail"><span class="rail-ind" id="railInd"></span></div>
      </div>
    </div>
    <div class="hover-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>悬停中 · 轮播暂停</div>
  </section>

  <section class="cap" id="cap" aria-live="polite">
    <div class="cap-no" id="capNo">01<b>01</b></div>
    <div class="cap-body">
      <h2 id="capName"></h2>
      <p id="capIdea"></p>
      <p class="cap-dom" id="capDom"></p>
    </div>
    <div class="cap-meta">
      <span class="chip accent" id="capScene"></span>
      <span class="chip" id="capDur"></span>
      <span class="chip" id="capSplit"></span>
    </div>
  </section>

  <div class="tl-wrap" id="tlWrap"><div>
    <section class="tl">
      <div class="tl-head"><b>时间轴</b><span class="sum" id="tlSum">等待一次切换</span>

/* =============================================================================

  const out = [];

  const a = ARTICLES[idx];

  root.style.setProperty('--tint', a.tint);

    <div class="h-text"><span class="h-tag">${a.tag}</span><h1 class="h-title"></h1><p class="h-excerpt"></p>
      <button class="h-btn" tabindex="-1">阅读全文</button></div>
    <div class="h-deckcol"><div class="album"></div><div class="pill-ph"></div></div>`;

  const tt = fillTokens(title, a.title, RE_TITLE);

 * 5. 编舞引擎：t 工具集 + 注册表（驱动时间轴 / 暂停 / 变速 / 拖动）
 * ========================================================================== */

    get W() { return hero.clientWidth; },
    get H() { return hero.clientHeight; },

/* ---------------------------------------------------------------------------

  }
  updatePillFill();
  if (S.tr) setCursor(S.tr.master.currentTime / S.tr.total, S.tr);
  requestAnimationFrame(loop);
}

/* =============================================================================
 * 8. UI：进度胶囊 / 缩略导航 / 说明 / 时间轴 / 控制条
 * ========================================================================== */
const pillsEl = $('#pills'), railEl = $('#rail');
ARTICLES.forEach((a, i) => {
  const p = h('button', 'pill', '<i></i>'); p.setAttribute('aria-label', `第 ${i + 1} 篇：${a.title}`);
  p.addEventListener('click', () => switchTo(i)); pillsEl.append(p);
  const th = h('button', 'thumb'); th.append(coverEl(a.covers[0])); th.setAttribute('aria-label', a.title);
  th.addEventListener('click', () => switchTo(i)); railEl.append(th);
});
function placeChrome(s) {
  const hr = hero.getBoundingClientRect(), a = s.album.getBoundingClientRect();
  const w = $('#railWrap');
  w.style.left = `${a.left - hr.left + a.width / 2}px`;
  w.style.top = `${a.bottom - hr.top + (G === GEOM.mobile ? 44 : 64) + 4.5}px`;
}
function updatePills() { $$('.pill', pillsEl).forEach((p, i) => p.classList.toggle('on', i === S.idx)); }
function updatePillFill() {
  const on = $$('.pill', pillsEl)[S.idx]; if (!on || !S.cur) return;
  const n = S.cur.cards.length;
  $$('.pill i', pillsEl).forEach((i) => { if (i.parentElement !== on) i.style.width = '0'; });
  on.firstChild.style.width = `${S.tr ? 0 : Math.min(100, S.elapsed / (n * PHOTO_MS) * 100)}%`;
}
function updateRail() { if (!S.tr || CHOREOS[S.scheme].chrome !== 'rail') $('#railInd').style.transform = `translateX(${railIndX(S.idx)}px)`; }

function updateCaption(run) {
  const c = CHOREOS[S.scheme];
  const no = String(S.scheme + 1).padStart(2, '0');
  $('#capNo').innerHTML = `${no}<b>${no}</b>`;
  $('#capName').textContent = c.name + (S.reduced ? '（减弱动效：纯 crossfade）' : '');
  $('#capIdea').textContent = c.idea;
  $('#capDom').innerHTML = '落地：' + c.dom + ' 降级：纯 crossfade。';
  $('#capScene').textContent = c.scene;
  if (run) {
    const outs = run.anims.filter((a) => a.g === 'out'), ins = run.anims.filter((a) => a.g === 'in');
    const outEnd = Math.max(...outs.map((a) => a.delay + a.dur));
    const inStart = Math.min(...ins.map((a) => a.delay)), inEnd = Math.max(...ins.map((a) => a.delay + a.dur));
    $('#capDur').innerHTML = `总时长 <span class="m">${run.total}ms</span>`;
    $('#capSplit').innerHTML = `出 <span class="m">${outEnd}</span> · 入 <span class="m">${inEnd - inStart}</span> · ${outEnd >= inStart ? '重叠' : '留白'} <span class="m">${Math.abs(outEnd - inStart)}</span>`;
  }
  const cap = $('#cap');
  if (!S.reduced) cap.animate([{ opacity: .2, filter: 'blur(6px)', transform: 'translateY(6px)' }, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0px)' }], { duration: 480, easing: EASE.expoOut });
}

const tlGrid = $('#tlGrid');
function renderTimeline(run) {
  const rows = [];
  const map = new Map();
  for (const a of run.anims) {
    const key = a.g + '|' + a.label;
    let r = map.get(key);
    if (!r) { r = { label: a.label, g: a.g, eases: new Set(), start: Infinity, end: 0, ticks: [] }; map.set(key, r); rows.push(r); }
    r.start = Math.min(r.start, a.delay); r.end = Math.max(r.end, a.delay + a.dur); r.eases.add(a.ease); r.ticks.push(a.delay);
  }
  const order = { out: 0, in: 1, fx: 2 };
  rows.sort((a, b) => order[a.g] - order[b.g] || a.start - b.start);
  const total = run.total, step = total > 1200 ? 200 : 100;
  let ticks = '';
  for (let ms = 0; ms <= total; ms += step) ticks += `<span style="left:${ms / total * 100}%">${ms}</span>`;
  let html = `<div class="tl-ruler"><span></span><div class="ticks">${ticks}</div><span></span></div>`;
  for (const r of rows) {
    const L = r.start / total * 100, Wd = (r.end - r.start) / total * 100;
    const tks = [...new Set(r.ticks)].filter((d) => d > r.start).slice(0, 40)
      .map((d) => `<span class="tk" style="left:${(d - r.start) / (r.end - r.start) * 100}%"></span>`).join('');
    html += `<div class="tl-row"><div class="lbl" title="${r.label}"><i class="g-${r.g}"></i>${r.label}</div><div class="track"><div class="bar g-${r.g}" style="left:${L}%;width:${Wd}%" title="${r.start}–${r.end}ms">${tks}</div></div><div class="ease">${[...r.eases].join(' / ')}</div></div>`;
  }
  html += '<div class="tl-cursor" id="tlCursor"></div>';
  tlGrid.innerHTML = html;
  $('#tlSum').textContent = `${CHOREOS[run.scheme].name}${run.reduced ? '（降级）' : ''} · 共 ${run.anims.length} 条动画 · ${rows.length} 个图层 · ${total}ms`;
}
function setCursor(p, run) {
  const c = $('#tlCursor'); if (!c) return;
  p = Math.max(0, Math.min(1, p || 0));
  c.style.setProperty('--p', p);
  c.dataset.t = `${Math.round(p * (run?.total || 0))}ms`;
}
/* 拖动时间轴 = 逐帧查看 */
function seek(p) {
  const run = S.tr; if (!run) return;
  setPlaying(false);
  const tms = Math.max(0, Math.min(1, p)) * run.total;
  run.anims.forEach((a) => { a.anim.pause(); a.anim.currentTime = Math.min(tms, a.delay + a.dur - .01); });
  run.master.pause(); run.master.currentTime = Math.min(tms, run.total - .01);
  setCursor(tms / run.total, run);
}
let scrubbing = false;
function scrubAt(ev) {
  const r = tlGrid.getBoundingClientRect();
  const lab = parseFloat(getComputedStyle(tlGrid).getPropertyValue('--lab')), ew = parseFloat(getComputedStyle(tlGrid).getPropertyValue('--easew'));
  seek((ev.clientX - r.left - lab) / (r.width - lab - ew));
}
tlGrid.addEventListener('pointerdown', (ev) => {
  if (!S.tr) { if (S.lastRun) { replay(); } else return; }
  scrubbing = true; tlGrid.setPointerCapture(ev.pointerId); scrubAt(ev);
});
tlGrid.addEventListener('pointermove', (ev) => { if (scrubbing) scrubAt(ev); });
tlGrid.addEventListener('pointerup', () => { scrubbing = false; });
/** 回放上一次切换：退回上一篇再切回来 */
function replay() {
  const target = S.idx;
  const prev = S.prevIdx === S.idx ? (S.idx + ARTICLES.length - 1) % ARTICLES.length : S.prevIdx;
  // 瞬切回上一篇（无动画），再以当前方案切入
  S.cur.root.remove(); S.cur = buildSlide(prev); S.idx = prev; placeChrome(S.cur);
  switchTo(target);
}

function setPlaying(on) {
  S.playing = on;
  const all = [...(S.tr ? S.tr.anims.map((a) => a.anim) : []), ...(S.tr ? [S.tr.master] : []), ...S.rot];
  all.forEach((a) => (on ? a.play() : a.pause()));
  $('#icoPlay').innerHTML = on ? '<path d="M9 6v12M15 6v12"/>' : '<path d="M8 5.5v13l11-6.5z"/>';
  $('#btnPlay').setAttribute('aria-label', on ? '暂停' : '播放');
}
function setSpeed(v) {
  S.speed = v;
  const all = [...(S.tr ? S.tr.anims.map((a) => a.anim) : []), ...(S.tr ? [S.tr.master] : []), ...S.rot];
  all.forEach((a) => { if (a.playState === 'running') a.updatePlaybackRate(v); else a.playbackRate = v; });
  syncSeg($('#segSpeed'), SPEEDS.indexOf(v));
}
function setScheme(i, run = true) {
  S.scheme = i;
  hero.classList.toggle('has-rail', CHOREOS[i].chrome === 'rail');
  syncSeg($('#segScheme'), i);
  updateCaption(null);
  if (run) requestAnimationFrame(() => switchTo(S.idx + 1));
}
function setReduced(on) {
  S.reduced = on;
  document.documentElement.dataset.reduced = on ? '1' : '0';
  $('#btnReduced').setAttribute('aria-pressed', String(on));
  updateCaption(null);
}
function setPalette(i) {
  const p = PALETTES[i];
  document.documentElement.style.setProperty('--primary', p.p);
  document.documentElement.style.setProperty('--primary-deep', p.d);
  $$('.dot').forEach((d, k) => d.setAttribute('aria-pressed', String(k === i)));
}
const ICO_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>';
const ICO_MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
function setMode(m, ev) {
  const apply = () => { document.documentElement.dataset.mode = m; $('#icoMode').innerHTML = m === 'dark' ? ICO_MOON : ICO_SUN; };
  if (!document.startViewTransition || S.reduced || !ev) { apply(); return; }
  const x = ev.clientX, y = ev.clientY, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
    { duration: 650, easing: EASE.expoOut, pseudoElement: '::view-transition-new(root)' })).catch(() => {});
}

/* 分段控件 + 滑动指示器 */
function syncSeg(seg, i) {
  const btns = $$('button', seg), ind = $('.seg-ind', seg);
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const b = btns[i]; if (!b) return;
  ind.style.width = `${b.offsetWidth}px`; ind.style.transform = `translateX(${b.offsetLeft}px)`;
}
const SPEEDS = [0.25, 0.5, 1];
CHOREOS.forEach((c, i) => {
  const b = h('button', '', `<b>${i + 1}</b><span>${c.short}</span>`); b.title = `${c.name} · ${c.scene}`;
  b.addEventListener('click', () => setScheme(i)); $('#segScheme').append(b);
});
SPEEDS.forEach((v) => { const b = h('button', '', `${v}x`); b.addEventListener('click', () => setSpeed(v)); $('#segSpeed').append(b); });
PALETTES.forEach((p, i) => { const d = h('button', 'dot'); d.style.setProperty('--c', p.p); d.title = `${p.name} · ${p.p}`; d.setAttribute('aria-label', `色盘：${p.name}`); d.addEventListener('click', () => setPalette(i)); $('#pal').append(d); });

$('#btnPlay').addEventListener('click', () => setPlaying(!S.playing));
$('#btnNext').addEventListener('click', () => switchTo(S.idx + 1));
$('#btnPrev').addEventListener('click', () => switchTo(S.idx - 1));
$('#btnMode').addEventListener('click', (ev) => setMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark', ev));
$('#btnReduced').addEventListener('click', () => setReduced(!S.reduced));
$('#btnTl').addEventListener('click', () => {
  const on = $('#btnTl').getAttribute('aria-pressed') !== 'true';
  $('#btnTl').setAttribute('aria-pressed', String(on)); $('#tlWrap').classList.toggle('off', !on);
});
hero.addEventListener('mouseenter', () => { S.hover = true; hero.classList.add('hovering'); });
hero.addEventListener('mouseleave', () => { S.hover = false; hero.classList.remove('hovering'); });
addEventListener('keydown', (ev) => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.key === 'ArrowRight') { ev.preventDefault(); switchTo(S.idx + 1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); switchTo(S.idx - 1); }
  else if (ev.key === ' ') { ev.preventDefault(); setPlaying(!S.playing); }
  else if (/^[1-8]$/.test(ev.key)) setScheme(+ev.key - 1);
});

/* 尺寸变化：重建当前 slide（重新拆行 + 重算几何） */
let rsT = 0;
addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    if (S.tr) finishTransition();
    const photo = S.cur.photo; S.cur.root.remove(); S.cur = buildSlide(S.idx); S.cur.photo = photo; placeCards(S.cur); placeChrome(S.cur);
    syncSeg($('#segScheme'), S.scheme); syncSeg($('#segSpeed'), SPEEDS.indexOf(S.speed)); updateRail();
  }, 160);
});

/* =============================================================================
 * 9. 启动
 * ========================================================================== */
function boot() {
  $('#icoMode').innerHTML = ICO_MOON;
  setPalette(3);
  setReduced(S.reduced);
  S.cur = buildSlide(0);
  placeChrome(S.cur);
  setScheme(0, false);
  syncSeg($('#segSpeed'), 2);
  updatePills(); updateRail();
  requestAnimationFrame(loop);
}
boot();
document.fonts && document.fonts.ready.then(() => {
  if (S.tr) return;
  const photo = S.cur.photo; S.cur.root.remove(); S.cur = buildSlide(S.idx); S.cur.photo = photo; placeCards(S.cur); placeChrome(S.cur);
  syncSeg($('#segScheme'), S.scheme); syncSeg($('#segSpeed'), SPEEDS.indexOf(S.speed));
});

/* 调试 / 截图接口 */
window.__lab = {
  S, CHOREOS,
  scheme: (i) => setScheme(i, false),
  next: () => switchTo(S.idx + 1),
  go: (i) => switchTo(i),
  seek, setMode: (m) => setMode(m), setReduced, setPlaying, setSpeed, setPalette,
  run: () => S.tr, finish: finishTransition,
};
</script>
</body>
</html>
