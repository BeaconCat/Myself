<!doctype html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Myself Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Myself Mobile —— 原生式移动端 UI 提案（round 2）
   ---------------------------------------------------------------------
   设计决策
   1. 不是响应式缩放：移动端独立一套信息架构 = 底部标签栏（一级导航）
      + 左侧抽屉（身份 / 外观 / 标签 / 订阅 / 后台，低频）。
   2. 第五个位放「搜索」而不是「更多」：「更多」的内容（外观、标签、RSS、
      GitHub、后台）已经由抽屉承接；个人博客的一级内容只有四类，搜索是
      唯一跨内容类型的高频动作。V1 中它是胶囊旁独立的圆形按钮（动作 ≠ 位置），
      V2 中它是第 5 个 tab（贴底栏的惯例，App Store / Music 同款）。
   3. 主角原则：每屏只有一个主角 —— 首页是封面卡，文章是大标题，
      详情是正文，随想是图，关于是格言。其余元素降噪（字重/透明度梯度）。
   4. 值得截图的瞬间：抽屉拉开时主页面缩小后退成卡片（堆叠感）；
      悬浮底栏主色胶囊在 tab 间「前缘先走、后缘跟上」的 morph；
      灵动岛展开为轻提示（复制 RSS / 发布成功）。

   Token（落地为 SCSS 变量 / CSS 自定义属性）
   - 动效：--dur-fast .2s / --dur .35s / --dur-slow .6s
           --ease-out cubic-bezier(.2,.8,.3,1)  --ease-spring cubic-bezier(.2,.8,.3,1.2)
           --ease-sheet cubic-bezier(.22,1,.36,1)（iOS sheet 近似，无过冲）
   - 设备：--safe-top 54px（状态栏）/ --safe-bottom 34px（Home 指示条）
     落地写法：padding-bottom: calc(49px + env(safe-area-inset-bottom));
     需 <meta name="viewport" content="viewport-fit=cover">；
     悬浮栏 bottom: max(12px, calc(env(safe-area-inset-bottom) - 10px))。
     演示里没有真实安全区，以 --safe-bottom 模拟。
   - 圆角：--r-sm 12 / --r-md 16 / --r-lg 22 / --r-xl 30 / pill 999
   - 颜色：mode(dark/light) 决定中性色；palette 只提供 --primary / --primary-deep /
     --on-primary，其余（soft / ink / glow）用 color-mix 在运行时派生，
     与 client/src/themes/derive.ts 的思路一致。
   - 品牌三色 --accent-red / yellow / blue 只做点睛（进度、在线、热力图）。
   ===================================================================== */

@property --dp    { syntax: '<number>'; inherits: true; initial-value: 0; } /* 抽屉进度 0..1 */
@property --push  { syntax: '<number>'; inherits: true; initial-value: 0; } /* 详情推入 0..1 */
@property --stack { syntax: '<number>'; inherits: true; initial-value: 0; } /* sheet 全屏时后退 0..1 */

:root{
  --dur-fast:.2s; --dur:.35s; --dur-slow:.6s;
  --ease-out:cubic-bezier(.2,.8,.3,1);
  --ease-spring:cubic-bezier(.2,.8,.3,1.2);
  --ease-sheet:cubic-bezier(.22,1,.36,1);
  --ease-drawer:cubic-bezier(.2,.9,.25,1.04);

  --accent-red:#ff0032; --accent-yellow:#ffb300; --accent-blue:#0078ff;

  --font-sans:"Noto Sans SC", -apple-system, "PingFang SC", system-ui, sans-serif;
  --font-serif:"Noto Serif SC", "Songti SC", serif;
  --font-mono:"JetBrains Mono", ui-monospace, monospace;

  --safe-top:54px; --safe-bottom:34px; --nav-row:44px;
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:30px; --r-pill:999px;
  --g-primary:#0078ff;
}
@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast:.01ms; --dur:.01ms; --dur-slow:.01ms; }
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

*{ box-sizing:border-box; margin:0; padding:0; }
button,input,textarea{ font:inherit; color:inherit; background:none; border:0; outline:none; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
svg{ display:block; }

/* ============================== 画布 ============================== */
html[data-mode=dark]{ --c-bg:#03060c; --c-text:#e6ecf6; --c-text-2:#7c8aa3; --c-line:rgba(150,170,210,.13); --c-panel:rgba(16,23,38,.72); --c-shadow:rgba(0,0,0,.6); }
html[data-mode=light]{ --c-bg:#e7ebf1; --c-text:#0b1220; --c-text-2:#5a6780; --c-line:rgba(11,18,32,.1); --c-panel:rgba(255,255,255,.72); --c-shadow:rgba(40,60,100,.25); }
body{
  min-height:100vh; color:var(--c-text); font-family:var(--font-sans);
  background:
    radial-gradient(1100px 520px at 12% -8%, color-mix(in oklab, var(--g-primary) 16%, transparent), transparent 62%),
    radial-gradient(900px 500px at 92% 110%, color-mix(in oklab, var(--g-primary) 10%, transparent), transparent 60%),
    var(--c-bg);
  -webkit-font-smoothing:antialiased;
}
.top{
  position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  padding:16px 48px; background:color-mix(in oklab, var(--c-bg) 70%, transparent);
  backdrop-filter:blur(20px) saturate(160%); border-bottom:1px solid var(--c-line);
}
.brand{ display:flex; align-items:center; gap:12px; margin-right:auto; }
.brand .mark{ width:34px; height:34px; border-radius:9px; overflow:hidden; box-shadow:0 4px 14px -4px rgba(0,60,160,.6); }
.brand b{ font-family:var(--font-serif); font-size:19px; letter-spacing:.01em; }
.brand small{ display:block; font-size:12px; color:var(--c-text-2); margin-top:1px; }
.ctl{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--c-text-2); }
.gseg{ position:relative; display:flex; padding:3px; border-radius:999px; background:var(--c-panel); border:1px solid var(--c-line); }
.gseg button{ position:relative; z-index:1; padding:7px 14px; border-radius:999px; font-size:13px; color:var(--c-text-2); transition:color var(--dur) var(--ease-out); }
.gseg button.on{ color:#fff; }
.gseg .th{ position:absolute; top:3px; bottom:3px; border-radius:999px; background:linear-gradient(180deg, var(--g-primary), color-mix(in oklab, var(--g-primary) 70%, black)); box-shadow:0 6px 16px -6px var(--g-primary); transition:left var(--dur) var(--ease-spring), width var(--dur) var(--ease-spring); }
.gdots{ display:flex; gap:8px; }
.gdots button{ width:22px; height:22px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px var(--c-bg), 0 0 0 3px transparent; transition:box-shadow var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-spring); }
.gdots button.on{ box-shadow:0 0 0 2px var(--c-bg), 0 0 0 4px var(--c); }
.gdots button:active,.gseg button:active{ transform:scale(.96); }
.lede{ max-width:1100px; margin:26px auto 0; padding:0 48px; font-size:13.5px; line-height:1.8; color:var(--c-text-2); text-align:center; }
.lede b{ color:var(--c-text); font-weight:600; }
.row{ padding:30px 32px 30px; }
.row-h{ display:flex; align-items:baseline; justify-content:center; gap:14px; margin-bottom:26px; }
.row-h h2{ font-family:var(--font-serif); font-size:22px; font-weight:700; }
.row-h span{ font-size:13px; color:var(--c-text-2); }
.phones{ display:flex; flex-wrap:wrap; justify-content:center; gap:52px 44px; }
.cell{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.cap{ width:414px; display:flex; align-items:baseline; gap:10px; padding:0 18px; font-size:13px; color:var(--c-text-2); }
.cap b{ font-family:var(--font-mono); font-weight:500; font-size:12px; color:var(--g-primary); }
.cap strong{ color:var(--c-text); font-weight:600; font-size:14px; }
.cap span{ margin-left:auto; font-size:12px; }

/* ============================== 设备外框 ============================== */
.device{
  position:relative; width:414px; height:868px; padding:12px; border-radius:68px;
  background:linear-gradient(150deg,#5a5f69 0%,#2a2d33 22%,#17191d 50%,#2c2f35 78%,#51555e 100%);
  box-shadow:
    0 0 0 1px #07080a,
    inset 0 0 0 1.5px rgba(255,255,255,.22),
    inset 0 0 0 5px #0c0d10,
    0 50px 90px -40px var(--c-shadow),
    0 30px 60px -30px color-mix(in oklab, var(--g-primary) 30%, transparent);
}
.device .hw{ position:absolute; width:4px; border-radius:2px; background:linear-gradient(90deg,#1c1e22,#4a4e56); }
.device .hw.a{ left:-3px; top:128px; height:34px; } .device .hw.b{ left:-3px; top:190px; height:62px; }
.device .hw.c{ left:-3px; top:266px; height:62px; } .device .hw.d{ right:-3px; top:220px; height:96px; background:linear-gradient(270deg,#1c1e22,#4a4e56); }

/* ============================== 屏幕与主题 ============================== */
.screen{
  position:relative; width:390px; height:844px; border-radius:56px; overflow:hidden; isolation:isolate;
  font-family:var(--font-sans); color:var(--text); background:var(--drawer-bg);
  --dp:0; --push:0; --stack:0;
  transition:--dp .56s var(--ease-drawer), --push .52s var(--ease-sheet), --stack .5s var(--ease-sheet);
  user-select:none; -webkit-user-select:none;
  --soft: color-mix(in oklab, var(--primary) 16%, transparent);
  --glow: color-mix(in oklab, var(--primary) 50%, transparent);
}
.screen.dragging{ transition:none; }
.screen[data-mode=dark]{
  color-scheme:dark;
  --bg:#0B1220; --bg-deep:#060B16; --elev:#111A2C; --elev-2:#172238;
  --fill:rgba(150,172,212,.08); --fill-2:rgba(150,172,212,.14);
  --line:rgba(150,172,212,.13); --line-2:rgba(150,172,212,.22);
  --text:#EAF0FA; --text-2:#A2AFC5; --text-3:#6A7891;
  --glass:rgba(17,26,44,.58); --glass-2:rgba(12,19,33,.8); --glass-line:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.07);
  --drawer-bg:#03070F; --scrim:rgba(0,3,10,.55);
  --shadow:0 18px 40px -16px rgba(0,4,14,.85);
  --ink: color-mix(in oklab, var(--primary) 72%, white);
  --code-bg:#070D19;
}
.screen[data-mode=light]{
  color-scheme:light;
  --bg:#F3F5F9; --bg-deep:#E8ECF2; --elev:#FFFFFF; --elev-2:#F8F9FC;
  --fill:rgba(11,18,32,.045); --fill-2:rgba(11,18,32,.08);
  --line:rgba(11,18,32,.085); --line-2:rgba(11,18,32,.15);
  --text:#0B1220; --text-2:#4A576E; --text-3:#8994A7;
  --glass:rgba(255,255,255,.8); --glass-2:rgba(255,255,255,.88); --glass-line:rgba(11,18,32,.08); --glass-hi:rgba(255,255,255,.9);
  --drawer-bg:#DCE2EB; --scrim:rgba(8,14,28,.28);
  --shadow:0 18px 40px -18px rgba(30,50,90,.35);
  --ink: color-mix(in oklab, var(--primary) 78%, black);
  --code-bg:#0B1220;
}
.glass{
  background:var(--glass); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--glass-line), inset 0 1px 0 var(--glass-hi);
}
/* 按压反馈：全站统一 scale(.96) + 回弹 */
.tap{ transition:transform var(--dur-fast) var(--ease-spring), background-color var(--dur-fast), opacity var(--dur-fast); }
.tap:active{ transform:scale(.96); transition-duration:.08s; }

/* 图标：1.5 线性，选中态 .f 填充、.d 细节镂空 */
.ic{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.ic .f{ fill:transparent; transition:fill var(--dur) var(--ease-out); }
.ic .d{ transition:stroke var(--dur) var(--ease-out); }
.ic.s{ width:18px; height:18px; } .ic.xs{ width:15px; height:15px; }

/* ============================== 系统层：状态栏 / 灵动岛 / Home 条 ============================== */
.statusbar{ position:absolute; z-index:60; top:0; left:0; right:0; height:54px; pointer-events:none; color:var(--text); transition:color var(--dur) var(--ease-out); }
.screen.sb-light .statusbar{ color:#fff; }
.sb-l,.sb-r{ position:absolute; top:0; height:54px; width:133px; display:flex; align-items:center; justify-content:center; padding-top:5px; }
.sb-l{ left:0; font-weight:600; font-size:16.5px; letter-spacing:-.01em; padding-left:14px; }
.sb-r{ right:0; gap:6px; padding-right:12px; }
.sb-r svg{ fill:currentColor; }
.island{
  position:absolute; z-index:61; top:11px; left:50%; width:124px; height:36px; margin-left:-62px; border-radius:20px; background:#000;
  display:flex; align-items:center; gap:10px; padding:0 16px; color:#fff; overflow:hidden;
  transition:width .5s var(--ease-spring), margin-left .5s var(--ease-spring), height .5s var(--ease-spring), border-radius .5s var(--ease-spring);
}
.island .isl-ic{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--primary); color:var(--on-primary); flex:none; opacity:0; transform:scale(.4); transition:all .35s var(--ease-spring); }
.island .isl-t{ font-size:13px; font-weight:500; white-space:nowrap; opacity:0; transform:translateY(4px); transition:all .3s var(--ease-out); }
.island .isl-t small{ color:rgba(255,255,255,.55); margin-left:6px; font-size:12px; }
.island.wide{ width:292px; margin-left:-146px; height:44px; border-radius:24px; }
.island.wide .isl-ic,.island.wide .isl-t{ opacity:1; transform:none; transition-delay:.12s; }
.homebar{ position:absolute; z-index:62; bottom:8px; left:50%; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:var(--text); opacity:.88; pointer-events:none; transition:background var(--dur); }
.screen.sb-light .homebar{ background:#fff; }

/* ============================== 抽屉 + 舞台（卡片堆叠） ============================== */
.drawer{
  position:absolute; z-index:1; inset:0 auto 0 0; width:318px; padding:64px 22px 40px 24px; overflow-y:auto; scrollbar-width:none;
  background:
    radial-gradient(420px 300px at -10% 104%, color-mix(in oklab, var(--primary) 30%, transparent), transparent 70%),
    radial-gradient(200px 140px at 12% 100%, rgba(255,255,255,.08), transparent 70%);
  opacity:calc(.2 + var(--dp) * .8);
  transform:translateX(calc((1 - var(--dp)) * -56px)) scale(calc(.94 + var(--dp) * .06));
  transform-origin:left center;
}
.stage{
  position:absolute; z-index:2; inset:0; overflow:hidden; background:var(--bg);
  border-radius:calc(56px - var(--dp) * 12px + var(--stack) * -14px);
  transform:
    translateX(calc(var(--dp) * 272px))
    translateY(calc(var(--stack) * 14px))
    scale(calc(1 - var(--dp) * .15 - var(--stack) * .075));
  box-shadow:0 30px 60px -12px rgba(0,0,0,calc(var(--dp) * .55)), 0 0 0 .5px rgba(255,255,255,calc(var(--dp) * .1));
}
.screen[data-mode=light] .stage{ box-shadow:0 30px 60px -18px rgba(20,40,80,calc(var(--dp) * .45)); }
.stage-dim{ position:absolute; z-index:40; inset:0; background:#000; opacity:calc(var(--dp) * .38 + var(--stack) * .3); pointer-events:none; }
.screen.drawer-open .stage-dim{ pointer-events:auto; }
.screen[data-mode=light] .stage-dim{ opacity:calc(var(--dp) * .1 + var(--stack) * .18); }
.stage-dim{ transition:opacity .4s var(--ease-out); }
.screen.dragging .stage-dim{ transition:none; }
.screen.as-open .stage-dim{ opacity:.55; pointer-events:auto; }
.screen.as-open .app-a .tabwrap{ z-index:45; }
.screen[data-mode=light].as-open .stage-dim{ opacity:.22; }

/* 抽屉内容 */
.dr-author{ display:flex; flex-direction:column; gap:14px; padding-bottom:22px; }
.dr-author .who{ display:flex; align-items:center; gap:14px; }
.dr-author b{ display:block; font-family:var(--font-serif); font-size:22px; font-weight:700; letter-spacing:.01em; }
.dr-author small{ font-size:13px; color:var(--text-3); }
.dr-motto{ font-family:var(--font-serif); font-size:15px; line-height:1.7; color:var(--text-2); padding-left:1px; }
.dr-motto::before{ content:"「"; color:var(--ink); } .dr-motto::after{ content:"」"; color:var(--ink); }
.dr-h{ font-size:12px; font-weight:500; color:var(--text-3); letter-spacing:.08em; margin:22px 0 12px; }
.seg2{ position:relative; display:grid; grid-template-columns:1fr 1fr; padding:3px; border-radius:14px; background:var(--fill); box-shadow:inset 0 0 0 .5px var(--line); }
.seg2 button{ position:relative; z-index:1; height:38px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:14px; color:var(--text-2); border-radius:11px; transition:color var(--dur) var(--ease-out); }
.seg2 button.on{ color:var(--text); font-weight:500; }
.seg2 .th{ position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:11px; background:var(--elev-2); box-shadow:0 2px 8px -2px rgba(0,0,0,.35), inset 0 0 0 .5px var(--line); transform:translateX(calc(var(--i, 0) * 100%)); transition:transform var(--dur) var(--ease-spring); }
.screen[data-mode=light] .seg2 .th{ background:#fff; box-shadow:0 2px 8px -2px rgba(20,40,80,.2); }
.dr-pal{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.pal{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; color:var(--text-3); }
.pal i{ position:relative; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--c) 70%, white), var(--c) 55%, color-mix(in oklab, var(--c) 70%, black)); box-shadow:0 8px 18px -8px var(--c); transition:transform var(--dur) var(--ease-spring); }
.pal i::after{ content:""; position:absolute; inset:-5px; border-radius:50%; box-shadow:0 0 0 2px var(--c); opacity:0; transform:scale(.8); transition:all var(--dur) var(--ease-spring); }
.pal.on i::after{ opacity:1; transform:none; }
.pal.on{ color:var(--text); font-weight:500; }
.dr-tags{ display:flex; flex-wrap:wrap; gap:8px 8px; }
.dr-tags button{ display:inline-flex; align-items:baseline; gap:5px; padding:6px 12px; border-radius:999px; background:var(--fill); color:var(--text-2); font-size:13px; }
.dr-tags button em{ font-style:normal; font-size:11px; color:var(--text-3); font-family:var(--font-mono); }
.dr-tags button.big{ font-size:15px; color:var(--text); }
.list{ border-radius:18px; background:var(--fill); overflow:hidden; box-shadow:inset 0 0 0 .5px var(--line); }
.li{ position:relative; width:100%; display:flex; align-items:center; gap:13px; padding:0 14px; height:52px; text-align:left; font-size:15px; }
.li + .li::before{ content:""; position:absolute; top:0; left:50px; right:0; height:.5px; background:var(--line-2); }
.li .lic{ width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:#fff; background:var(--c, var(--primary)); flex:none; }
.li .lic .ic{ width:17px; height:17px; stroke-width:1.7; }
.li span{ flex:1; }
.li small{ font-size:13px; color:var(--text-3); }
.li .chev{ color:var(--text-3); width:16px; height:16px; }
.li:active{ background:var(--fill-2); }
.dr-admin{ margin-top:12px; }
.dr-foot{ margin-top:22px; font-size:12px; color:var(--text-3); line-height:1.7; }

/* ============================== App / 页面 ============================== */
.app{ position:absolute; inset:0; }
.screen[data-role=visitor] .app-a,.screen[data-role=admin] .app-v{ display:none; }
.app.enter{ animation:appIn .6s var(--ease-out); }
@keyframes appIn{ from{ opacity:0; transform:scale(1.04); filter:blur(6px); } }
.pages{ position:absolute; inset:0; transform:translateX(calc(var(--push) * -30%)); }
.pages-dim{ position:absolute; inset:0; z-index:20; background:#000; opacity:calc(var(--push) * .32); pointer-events:none; }
.page{ position:absolute; inset:0; visibility:hidden; opacity:0; }
.page.on{ visibility:visible; opacity:1; }
.page.enter{ animation:pageIn .42s var(--ease-out); }
@keyframes pageIn{ from{ opacity:0; transform:translateY(10px) scale(.992); } }
.scroll{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-top:calc(var(--safe-top) + var(--nav-row)); touch-action:pan-y; overscroll-behavior:contain; }
.scroll::-webkit-scrollbar{ display:none; }
.tail{ height:136px; }

/* 导航：大标题折叠（iOS large title） */
.nav{ position:absolute; z-index:10; top:0; left:0; right:0; pointer-events:none; }
.nav > *{ pointer-events:auto; }
.nav-bg{
  position:absolute; inset:0 0 auto 0; height:var(--nav-h, 98px); pointer-events:none; opacity:0;
  background:var(--glass-2); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 .5px 0 var(--line-2); transition:opacity var(--dur) var(--ease-out);
}
.page.scrolled .nav-bg{ opacity:1; }
.nav-row{ position:relative; height:var(--nav-row); margin-top:var(--safe-top); display:flex; align-items:center; padding:0 16px; gap:8px; }
.nav-title{ position:absolute; left:80px; right:80px; text-align:center; font-size:16.5px; font-weight:600; opacity:0; transform:translateY(6px); transition:all var(--dur) var(--ease-out); pointer-events:none; }
.page.titled .nav-title{ opacity:1; transform:none; }
.nav-r{ margin-left:auto; display:flex; gap:8px; }
.icbtn{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--text); background:var(--fill); }
.icbtn .ic{ width:20px; height:20px; }
.av-btn{ width:36px; height:36px; border-radius:50%; padding:0; position:relative; }
.av-btn::after{ content:""; position:absolute; right:-1px; bottom:1px; width:10px; height:10px; border-radius:50%; background:#2bd46a; box-shadow:0 0 0 2px var(--bg); }
.avatar{ display:block; width:100%; height:100%; border-radius:50%; overflow:hidden; box-shadow:0 0 0 .5px rgba(255,255,255,.14); }
.avatar svg{ width:100%; height:100%; }
.lt-block{ padding:2px 20px 14px; }
.lt-eyebrow{ font-size:13px; font-weight:500; color:var(--text-3); letter-spacing:.04em; margin-bottom:2px; }
.lt{ font-family:var(--font-serif); font-size:34px; font-weight:700; line-height:1.25; letter-spacing:.01em; transform-origin:left center; }
.lt-sub{ margin-top:6px; font-size:14px; color:var(--text-2); line-height:1.6; }
.nav-extra{ position:absolute; left:0; right:0; top:calc(var(--safe-top) + var(--nav-row)); padding:4px 0 10px; will-change:transform; }
.extra-spacer{ height:52px; }

/* ============================== 封面光影构成（无真实照片时） ============================== */
.cv{ position:absolute; inset:0; overflow:hidden; background:#040914; isolation:isolate; container-type:size; }
.cv i{ position:absolute; display:block; }
/* 门：左白页 + 右钴蓝页 + 地面透出的光 */
.cv-door{ background:radial-gradient(70% 48% at 50% 80%, #16306a 0%, transparent 70%), linear-gradient(#060d1d, #02050d); }
.cv-door .halo{ left:25%; right:25%; top:12%; bottom:30%; background:radial-gradient(closest-side, rgba(90,140,255,.35), transparent); filter:blur(4cqw); }
.cv-door .l,.cv-door .r{ top:20%; height:50%; width:21%; border-radius:3.5cqw; }
.cv-door .l{ left:29%; background:linear-gradient(180deg,#fff,#dde5f4); transform:perspective(70cqw) rotateY(34deg); transform-origin:left center; box-shadow:0 0 10cqw rgba(190,210,255,.3); }
.cv-door .r{ right:29%; background:linear-gradient(200deg,#4094ff,#0b58e6 50%,#0535a0); transform:perspective(70cqw) rotateY(-34deg); transform-origin:right center; }
.cv-door .floor{ left:12%; right:-14%; top:69%; bottom:-6%; background:linear-gradient(180deg, rgba(240,244,255,.95), rgba(150,170,232,.5) 42%, rgba(50,70,150,0) 92%); clip-path:polygon(35% 0, 57% 0, 100% 100%, 0 100%); filter:blur(1.1cqw); }
/* 光谱扇：四季四束光（主题系统） */
.cv-bands{ background:radial-gradient(90% 60% at 50% 104%, #0f2250, transparent 70%), #02060f; }
.cv-bands .fan{ inset:-12%; background:conic-gradient(from -44deg at 50% 100%, transparent 0 6deg, rgba(0,200,83,.9) 12deg, transparent 20deg 26deg, rgba(255,0,50,.85) 32deg, transparent 40deg 46deg, rgba(255,179,0,.9) 52deg, transparent 60deg 66deg, rgba(0,120,255,.95) 72deg, transparent 80deg 360deg); filter:blur(2.6cqw); mix-blend-mode:screen; }
.cv-bands .core{ left:38%; right:38%; bottom:9%; height:8%; background:radial-gradient(closest-side, #fff, rgba(255,255,255,0)); filter:blur(1cqw); }
.cv-bands .horizon{ left:-5%; right:-5%; top:86%; height:.8cqw; background:linear-gradient(90deg, transparent, rgba(255,255,255,.85) 50%, transparent); filter:blur(.4cqw); }
.cv-bands .floor{ left:0; right:0; top:87%; bottom:0; background:linear-gradient(180deg, rgba(40,70,140,.55), #02060f); }
/* 书页：台灯光锥照在两页纸上（写作） */
.cv-pages{ background:radial-gradient(60% 50% at 62% 22%, rgba(255,179,0,.28), transparent 64%), linear-gradient(#0b1428, #03070f); }
.cv-pages .lamp{ top:-12%; left:40%; width:48%; height:92%; background:linear-gradient(180deg, rgba(255,214,140,.55), rgba(255,200,120,0) 90%); clip-path:polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter:blur(2.2cqw); }
.cv-pages .pg{ left:18%; top:24%; width:62%; height:40%; border-radius:1.6cqw; transform:perspective(90cqw) rotateX(54deg) rotateZ(-15deg); box-shadow:0 6cqw 10cqw rgba(0,0,0,.6); }
.cv-pages .p2{ background:linear-gradient(160deg,#cbd5ea,#8fa1c6); transform:perspective(90cqw) rotateX(54deg) rotateZ(-3deg) translate(8%,-14%); }
.cv-pages .p1{ background:repeating-linear-gradient(180deg, transparent 0 8%, rgba(20,30,55,.2) 8% 9.2%), linear-gradient(160deg,#fff,#e2e7f1); background-clip:padding-box; border:3cqw solid transparent; border-image:none; }
/* 门缝光束 + 信号环（API） */
.cv-beam{ background:radial-gradient(60% 50% at 30% 58%, #0a2250, transparent 70%), #02060e; }
.cv-beam .rings{ inset:-10%; background:repeating-radial-gradient(circle at 34% 58%, transparent 0 10cqw, rgba(0,120,255,.5) 10cqw 10.8cqw, transparent 10.8cqw 16cqw, rgba(255,0,50,.4) 16cqw 16.6cqw, transparent 16.6cqw 22cqw); -webkit-mask:radial-gradient(circle at 34% 58%, #000 18%, transparent 62%); mask:radial-gradient(circle at 34% 58%, #000 18%, transparent 62%); }
.cv-beam .ray{ left:30%; top:30%; width:110%; height:56%; background:linear-gradient(90deg, rgba(220,232,255,.8), rgba(0,120,255,.18) 55%, transparent 85%); clip-path:polygon(0 42%, 100% 0, 100% 100%, 0 58%); filter:blur(1.6cqw); }
.cv-beam .gap{ left:28%; top:12%; width:5%; height:46%; border-radius:1.2cqw; background:linear-gradient(#fff,#b8d0ff); box-shadow:0 0 6cqw 1.5cqw rgba(120,170,255,.7), 0 0 22cqw 5cqw rgba(0,120,255,.3); }

/* 随想配图：光影「照片」 */
.ph{ position:relative; overflow:hidden; background:#0a1224; }
.ph0{ background:radial-gradient(38% 55% at 50% 102%, rgba(160,190,255,.9), transparent 70%), linear-gradient(90deg, #050c1a 45%, #eef3ff 45.5% 48.5%, #050c1a 49%); }
.ph1{ background:radial-gradient(14% 12% at 62% 60%, #ffe2a0, #ff8a3d 50%, transparent 72%), linear-gradient(180deg, #081a45 0%, #27407f 36%, #ff7a45 60%, #ffb300 64%, #0b1426 64.5%, #122044 100%); }
.ph2{ background:radial-gradient(4% 4% at 72% 26%, #fff3c8, transparent), repeating-linear-gradient(90deg, #0b1733 0 10%, #0e1d40 10% 12%), linear-gradient(#0a1a3a,#0b1220); }
.ph2::after{ content:""; position:absolute; inset:48% 0 0; background:repeating-linear-gradient(90deg, #050b16 0 12%, transparent 12% 14%, #07101f 14% 30%, transparent 30% 33%), repeating-linear-gradient(180deg, transparent 0 8px, rgba(255,200,110,.35) 8px 10px); }
.ph3{ background:radial-gradient(30% 30% at 30% 40%, rgba(120,255,170,.7), transparent), radial-gradient(40% 40% at 70% 65%, rgba(0,200,83,.6), transparent), linear-gradient(160deg,#07301c,#021a10); }
.ph4{ background:radial-gradient(22% 22% at 50% 58%, #ffd0d8, #ff0032 55%, transparent 72%), linear-gradient(180deg,#2a0610,#5a0a1c 58%, #12050a 58.5%, #1d0710); }
.ph5{ background:repeating-linear-gradient(115deg, rgba(255,210,120,.0) 0 12%, rgba(255,210,120,.28) 12% 16%), linear-gradient(160deg,#3a2200,#ffb300 120%); }
.ph6{ background:radial-gradient(60% 40% at 50% 100%, rgba(255,255,255,.8), transparent), linear-gradient(180deg,#0a2a66,#3f86ff 70%, #cfe2ff); }
.ph7{ background:radial-gradient(8% 8% at 20% 30%, rgba(255,179,0,.9), transparent), radial-gradient(10% 10% at 70% 22%, rgba(0,120,255,.9), transparent), radial-gradient(7% 7% at 45% 70%, rgba(255,0,50,.8), transparent), radial-gradient(12% 12% at 82% 76%, rgba(120,170,255,.6), transparent), radial-gradient(6% 6% at 30% 84%, rgba(255,255,255,.7), transparent), #070d1a; filter:saturate(1.2); }
.ph8{ background:linear-gradient(100deg, transparent 58%, rgba(0,0,0,.25) 58.5%), repeating-linear-gradient(180deg, transparent 0 11%, rgba(20,30,55,.15) 11% 12%), linear-gradient(160deg,#fbfbf8,#dcdfe6); }
.ph9{ background:linear-gradient(180deg,#07203a 0%,#0e4a6e 48%, #d6f1ff 49%, #0d3b5a 50.5%, #041525 100%); }
.ph10{ background:repeating-linear-gradient(90deg, rgba(255,0,50,.55) 0 3%, transparent 3% 9%), repeating-linear-gradient(90deg, rgba(0,120,255,.6) 0 2%, transparent 2% 7%), #050914; }
.ph11{ background:radial-gradient(70% 50% at 50% 100%, rgba(255,190,120,.55), transparent), linear-gradient(180deg,#9fb2c8,#5c6f88 60%,#2d3a4e); }
.ph12{ background:repeating-linear-gradient(180deg, transparent 0 14px, rgba(255,255,255,.0) 14px), linear-gradient(90deg, #050b16 0 10%, transparent 10%), #070f1f; }
.ph12::after{ content:""; position:absolute; inset:14% 12%; background:
  linear-gradient(90deg, #0078ff 0 22%, transparent 22% 26%, #6aa8ff 26% 58%, transparent 58%) 0 0/100% 7% no-repeat,
  linear-gradient(90deg, #ffb300 8% 30%, transparent 30% 34%, #9fb0c8 34% 70%, transparent 70%) 0 18%/100% 7% no-repeat,
  linear-gradient(90deg, #9fb0c8 8% 44%, transparent 44% 48%, #ff0032 48% 62%, transparent 62%) 0 36%/100% 7% no-repeat,
  linear-gradient(90deg, #9fb0c8 16% 52%, transparent 52%) 0 54%/100% 7% no-repeat,
  linear-gradient(90deg, #0078ff 0 18%, transparent 18% 22%, #9fb0c8 22% 40%, transparent 40%) 0 72%/100% 7% no-repeat; opacity:.9; }
.ph13{ background:radial-gradient(circle at 36% 46%, transparent 0 11%, #ffb300 11.5% 16%, transparent 16.5%), linear-gradient(90deg, transparent 0 46%, #ffb300 46% 80%, transparent 80%) 0 43%/100% 6% no-repeat, radial-gradient(60% 60% at 40% 45%, rgba(255,179,0,.18), transparent), #07101f; }

/* ============================== 首页 ============================== */
.hc{ position:relative; margin-top:4px; }
.hc-track{ position:relative; height:456px; perspective:1100px; touch-action:pan-y; }
.hc-card{ position:absolute; left:20px; top:0; width:350px; height:456px; transform:translateX(calc(var(--o) * 362px)) rotateY(calc(var(--o) * -10deg)) scale(var(--s,1)); transform-origin:center 60%; }
.hc:not(.drag) .hc-card{ transition:transform .7s var(--ease-out); }
.hc-inner{ position:absolute; inset:0; display:block; width:100%; border-radius:30px; overflow:hidden; text-align:left; color:#fff;
  box-shadow:0 30px 50px -26px rgba(0,10,40,.9), 0 0 0 .5px rgba(255,255,255,.1); }
.screen[data-mode=light] .hc-inner{ box-shadow:0 30px 50px -24px rgba(20,40,90,.45); }
.hc-art{ position:absolute; inset:0 -48px; transform:translateX(calc(var(--o) * -56px)); }
.hc:not(.drag) .hc-art{ transition:transform .7s var(--ease-out); }
.hc-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(2,6,14,.25) 0%, transparent 22%, transparent 42%, rgba(2,6,14,.62) 64%, rgba(2,6,14,.94) 100%); }
.hc-chip{ position:absolute; left:18px; top:18px; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; color:#fff; background:rgba(255,255,255,.14); backdrop-filter:blur(16px); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22); }
.hc-idx{ position:absolute; right:20px; top:22px; font-family:var(--font-mono); font-size:11.5px; color:rgba(255,255,255,.6); letter-spacing:.06em; }
.hc-t{ position:absolute; left:22px; right:22px; bottom:24px; }
.hc-t > *{ opacity:0; filter:blur(10px); transform:translate(var(--tx,0), var(--ty,14px)); transition:opacity .35s var(--ease-out), filter .35s var(--ease-out), transform .45s var(--ease-out); }
.hc-card.act .hc-t > *{ opacity:1; filter:none; transform:none; transition:opacity .6s var(--ease-out), filter .7s var(--ease-out), transform .8s var(--ease-out); }
.hc-card.act .hc-t > :nth-child(1){ transition-delay:.12s; } .hc-card.act .hc-t > :nth-child(2){ transition-delay:.2s; } .hc-card.act .hc-t > :nth-child(3){ transition-delay:.3s; }
.hc-meta{ font-size:12.5px; color:rgba(255,255,255,.66); margin-bottom:8px; letter-spacing:.02em; }
.hc-t h3{ font-family:var(--font-serif); font-size:27px; line-height:1.32; font-weight:700; letter-spacing:.01em; text-wrap:balance; }
.hc-t p{ margin-top:10px; font-size:14px; line-height:1.65; color:rgba(255,255,255,.72); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.hc-dots{ display:flex; justify-content:center; gap:6px; margin-top:16px; }
.hd{ position:relative; width:6px; height:6px; border-radius:3px; background:var(--fill-2); overflow:hidden; transition:width .45s var(--ease-spring), background var(--dur); }
.hd.on{ width:30px; }
.hd i{ position:absolute; inset:0 auto 0 0; width:0; background:var(--primary); border-radius:3px; }
.hd.on i{ animation:hdFill 6s linear forwards; }
.hc.drag .hd.on i,.hc.paused .hd.on i{ animation-play-state:paused; }
@keyframes hdFill{ to{ width:100%; } }

.sec{ margin-top:34px; }
.sec-h{ display:flex; align-items:baseline; padding:0 20px; margin-bottom:6px; }
.sec-h h2{ font-family:var(--font-serif); font-size:22px; font-weight:700; }
.sec-h .more{ margin-left:auto; display:flex; align-items:center; gap:2px; font-size:14px; color:var(--ink); }
.rows{ padding:0 4px; }
.arow{ position:relative; width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; border-radius:18px; }
.arow + .arow::before{ content:""; position:absolute; top:0; left:16px; right:16px; height:.5px; background:var(--line); }
.arow:active{ background:var(--fill); }
.arow .rt{ flex:1; min-width:0; }
.arow .meta{ font-size:12px; color:var(--text-3); margin-bottom:4px; }
.arow .meta em{ font-style:normal; color:var(--ink); font-weight:500; }
.arow b{ display:block; font-family:var(--font-serif); font-size:17px; font-weight:700; line-height:1.4; }
.arow .ex{ display:block; font-size:13px; color:var(--text-2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thumb{ position:relative; width:68px; height:68px; border-radius:16px; overflow:hidden; flex:none; box-shadow:0 0 0 .5px var(--line); }
.tp{ display:flex; gap:12px; overflow-x:auto; padding:8px 20px 6px; scroll-snap-type:x mandatory; scrollbar-width:none; scroll-padding:0 20px; touch-action:pan-x pan-y; }
.tp::-webkit-scrollbar{ display:none; }
.tcard{ scroll-snap-align:start; flex:none; width:268px; padding:16px; border-radius:22px; text-align:left; background:var(--elev); box-shadow:inset 0 0 0 .5px var(--line), var(--shadow); display:flex; flex-direction:column; gap:12px; }
.tcard p{ font-size:14.5px; line-height:1.7; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:73px; }
.tcard .strip{ display:flex; gap:4px; }
.tcard .strip .ph{ width:52px; height:52px; border-radius:10px; }
.tcard .strip .more{ width:52px; height:52px; border-radius:10px; display:grid; place-items:center; background:var(--fill-2); font-size:13px; color:var(--text-2); font-family:var(--font-mono); }
.tcard footer{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3); margin-top:auto; }
.mood{ font-style:normal; font-size:12px; color:var(--ink); }
.mood::before{ content:"#"; opacity:.6; margin-right:1px; }
.home-foot{ margin:44px 20px 0; padding-top:26px; border-top:.5px solid var(--line); display:flex; align-items:center; gap:12px; }
.home-foot .mk{ width:34px; height:34px; border-radius:10px; overflow:hidden; flex:none; }
.home-foot b{ font-family:var(--font-serif); font-size:15px; display:block; }
.home-foot small{ font-size:12px; color:var(--text-3); }
.home-foot .rss{ margin-left:auto; display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:var(--fill); font-size:13px; color:var(--text-2); }

/* ============================== 文章列表 ============================== */
.chips{ display:flex; gap:8px; overflow-x:auto; padding:0 20px; scrollbar-width:none; touch-action:pan-x; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; height:36px; padding:0 15px; border-radius:999px; display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text-2); background:var(--fill); box-shadow:inset 0 0 0 .5px var(--line); transition:background var(--dur) var(--ease-out), color var(--dur), box-shadow var(--dur); }
.chip em{ font-style:normal; font-family:var(--font-mono); font-size:11px; opacity:.6; }
.chip.on{ background:var(--text); color:var(--bg); box-shadow:none; font-weight:500; }
.grp{ padding:4px 20px 8px; font-size:12.5px; color:var(--text-3); letter-spacing:.06em; }
.feat{ display:block; width:calc(100% - 40px); margin:4px 20px 18px; text-align:left; }
.feat .fc{ position:relative; height:218px; border-radius:24px; overflow:hidden; box-shadow:0 22px 40px -24px rgba(0,10,40,.8), 0 0 0 .5px var(--line); }
.feat .meta{ margin-top:14px; font-size:12.5px; color:var(--text-3); }
.feat .meta em{ font-style:normal; color:var(--ink); font-weight:500; }
.feat h3{ margin-top:6px; font-family:var(--font-serif); font-size:23px; line-height:1.38; font-weight:700; }
.feat p{ margin-top:6px; font-size:14px; line-height:1.7; color:var(--text-2); }
.al .arow .thumb{ width:84px; height:84px; border-radius:18px; }
.al .arow b{ font-size:16.5px; }
.al .arow .ex{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.55; }
.al > *{ animation:listIn .5s var(--ease-out) backwards; }
.al > :nth-child(2){ animation-delay:.04s } .al > :nth-child(3){ animation-delay:.08s } .al > :nth-child(4){ animation-delay:.12s } .al > :nth-child(5){ animation-delay:.16s }
@keyframes listIn{ from{ opacity:0; transform:translateY(14px); } }
.empty{ padding:60px 30px; text-align:center; color:var(--text-3); font-size:14px; line-height:1.8; }

/* ============================== 文章详情（沉浸阅读） ============================== */
.detail{ position:absolute; z-index:30; inset:0; background:var(--bg); transform:translateX(calc((1 - var(--push)) * 104%)); box-shadow:-24px 0 50px rgba(0,0,0,calc(var(--push) * .35)); visibility:hidden; }
.screen.pushed .detail{ visibility:visible; }
.dt-scroll{ position:absolute; inset:0; overflow-y:auto; scrollbar-width:none; touch-action:pan-y; }
.dt-scroll::-webkit-scrollbar{ display:none; }
.dt-hero{ position:relative; height:400px; overflow:hidden; }
.dt-hero .cv{ transform:translateY(calc(var(--hy, 0) * .45px)) scale(1.02); }
.dt-fade{ position:absolute; inset:auto 0 0 0; height:220px; background:linear-gradient(180deg, transparent, color-mix(in oklab, var(--bg) 70%, transparent) 55%, var(--bg)); }
.dt-head{ position:relative; margin-top:-120px; padding:0 22px; }
.dt-meta{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-2); }
.tagp{ padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--ink); font-weight:500; font-size:12px; }
.dt-head h1{ margin-top:12px; font-family:var(--font-serif); font-size:30px; line-height:1.34; font-weight:900; letter-spacing:.01em; text-wrap:balance; }
.dt-lede{ margin-top:12px; font-family:var(--font-serif); font-size:16px; line-height:1.8; color:var(--text-2); }
.dt-by{ display:flex; align-items:center; gap:10px; margin-top:20px; padding:14px 0 22px; border-bottom:.5px solid var(--line); font-size:14px; }
.dt-by .avatar{ width:32px; height:32px; }
.dt-by small{ color:var(--text-3); font-size:12.5px; }
.prose{ padding:10px 22px 0; font-family:var(--font-serif); font-size:17px; line-height:1.95; color:color-mix(in oklab, var(--text) 90%, var(--bg)); user-select:text; }
.screen.big-type .prose{ font-size:19px; }
.prose h2{ margin:34px 0 10px; font-size:22px; line-height:1.45; font-weight:700; color:var(--text); scroll-margin-top:110px; }
.prose p{ margin:0 0 16px; letter-spacing:.01em; }
.prose code{ font-family:var(--font-mono); font-size:.8em; padding:2px 6px; border-radius:6px; background:var(--fill-2); color:var(--ink); }
.prose pre{ margin:6px -22px 20px; padding:18px 22px; background:var(--code-bg); color:#cfd9ea; font-family:var(--font-mono); font-size:12.5px; line-height:1.75; overflow-x:auto; scrollbar-width:none; box-shadow:inset 0 .5px 0 var(--line), inset 0 -.5px 0 var(--line); }
.prose pre .k{ color:#6aa8ff; } .prose pre .s{ color:#ffcf66; } .prose pre .c{ color:#5b6a84; }
.prose blockquote{ margin:22px 0; padding:4px 0 4px 18px; background:linear-gradient(var(--primary),var(--primary)) left/2px 100% no-repeat; font-size:19px; line-height:1.75; color:var(--text); font-weight:600; }
.prose ul{ margin:0 0 16px; padding-left:0; list-style:none; }

.dt-end{ padding:18px 22px 0; }

.dt-top{ position:absolute; z-index:5; top:0; left:0; right:0; height:98px; padding:54px 14px 0; display:flex; align-items:center; gap:8px; }
.dt-top-bg{ position:absolute; inset:0; background:var(--glass-2); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); box-shadow:0 .5px 0 var(--line-2); opacity:0; transition:opacity var(--dur) var(--ease-out); }
.dt-top .icbtn{ position:relative; background:rgba(8,14,28,.38); color:#fff; backdrop-filter:blur(14px); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18); transition:background var(--dur), color var(--dur); }
.dt-top .ttl{ position:relative; flex:1; text-align:center; font-size:15px; font-weight:600; opacity:0; transform:translateY(6px); transition:all var(--dur) var(--ease-out); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.detail.solid .dt-top-bg{ opacity:1; }
.detail.solid .dt-top .ttl{ opacity:1; transform:none; }
.detail.solid .dt-top .icbtn{ background:var(--fill); color:var(--text); box-shadow:none; }
.dt-prog{ position:absolute; left:0; bottom:0; height:2px; width:calc(var(--rp, 0) * 100%); background:linear-gradient(90deg, var(--primary), var(--accent-yellow)); opacity:0; transition:opacity var(--dur); }
.detail.solid .dt-prog{ opacity:1; }
.dt-dock{ position:absolute; z-index:6; left:50%; bottom:28px; display:flex; align-items:center; height:52px; padding:0 6px; border-radius:999px; transform:translateX(-50%); transition:transform .5s var(--ease-spring), opacity var(--dur); white-space:nowrap; }

.dk{ display:flex; align-items:center; gap:9px; height:40px; padding:0 14px; border-radius:999px; font-size:14px; }

/* ============================== 随想 ============================== */
.segc{ position:relative; display:grid; grid-template-columns:1fr 1fr; height:40px; margin:0 20px; padding:3px; border-radius:999px; background:var(--fill); box-shadow:inset 0 0 0 .5px var(--line); }
.segc button{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:6px; font-size:14px; color:var(--text-2); border-radius:999px; transition:color var(--dur); white-space:nowrap; }
.segc button.on{ color:var(--text); font-weight:600; }
.segc button em{ font-style:normal; font-family:var(--font-mono); font-size:11px; color:var(--text-3); }
.segc .th{ position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:999px; background:var(--elev-2); box-shadow:0 3px 10px -3px rgba(0,0,0,.45), inset 0 0 0 .5px var(--line-2); transform:translateX(calc(var(--i, 0) * 100%)); transition:transform .45s var(--ease-spring); }
.screen[data-mode=light] .segc .th{ background:#fff; box-shadow:0 3px 10px -4px rgba(20,40,80,.25); }
.th-view{ transition:opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out); }
.th-view[hidden]{ display:none; }
.th-view.in-r{ animation:inR .4s var(--ease-out); } .th-view.in-l{ animation:inL .4s var(--ease-out); }
@keyframes inR{ from{ opacity:0; transform:translateX(24px); } } @keyframes inL{ from{ opacity:0; transform:translateX(-24px); } }
.post{ display:flex; gap:12px; padding:16px 18px 14px; position:relative; }
.post + .post::before{ content:""; position:absolute; top:0; left:70px; right:0; height:.5px; background:var(--line); }
.post > .avatar{ width:40px; height:40px; flex:none; }
.post-main{ flex:1; min-width:0; }
.post header{ display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--text-3); }
.post header b{ font-size:15px; color:var(--text); font-weight:600; }
.post header .mood{ margin-left:auto; }
.post p{ margin-top:5px; font-size:15.5px; line-height:1.7; }
.post p .hl{ color:var(--ink); font-weight:500; }
.grid{ display:grid; gap:3px; margin-top:12px; border-radius:16px; overflow:hidden; }
.grid button{ position:relative; aspect-ratio:1; display:block; }
.grid button .ph{ position:absolute; inset:0; transition:filter var(--dur); }
.grid button:active .ph{ filter:brightness(.8); }
.g1{ grid-template-columns:1fr; } .g1 button{ aspect-ratio:4/3; }
.g2{ grid-template-columns:1fr 1fr; } .g3,.g9{ grid-template-columns:repeat(3,1fr); } .g4{ grid-template-columns:1fr 1fr; width:78%; }
.post-act{ display:flex; gap:22px; margin-top:10px; margin-left:-6px; }
.post-act button{ display:flex; align-items:center; gap:5px; height:32px; padding:0 6px; border-radius:10px; font-size:13px; color:var(--text-3); font-family:var(--font-mono); }
.post-act .ic{ width:19px; height:19px; }
.post-act .liked{ color:var(--accent-red); }
.post-act .liked .f{ fill:currentColor; }
.post-act .liked .ic{ animation:heart .5s var(--ease-spring); }
@keyframes heart{ 30%{ transform:scale(.7); } 70%{ transform:scale(1.25); } }
.mg{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:6px 0 0; }
.mg button{ position:relative; aspect-ratio:1; }
.mg button .ph{ position:absolute; inset:0; }
.mg-h{ padding:10px 20px 10px; display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-3); }

/* 全屏查看器 */
.viewer{ position:absolute; z-index:50; inset:0; visibility:hidden; touch-action:none; }
.viewer.on{ visibility:visible; }
.vw-bg{ position:absolute; inset:0; background:#000; opacity:0; transition:opacity .4s var(--ease-out); }
.viewer.on .vw-bg{ opacity:var(--vbg, 1); }
.viewer.drag .vw-bg{ transition:none; }
.vw-track{ position:absolute; inset:0; display:flex; }
.vw-track.anim{ transition:transform .45s var(--ease-out); }
.vw-slide{ flex:none; width:390px; height:100%; display:grid; place-items:center; }
.vw-img{ width:390px; height:488px; border-radius:0; transform-origin:0 0; }
.vw-img.anim{ transition:transform .45s var(--ease-sheet), border-radius .45s; }
.vw-ui{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s var(--ease-out); color:#fff; }
.viewer.on .vw-ui{ opacity:calc(var(--vbg, 1)); }
.vw-ui > *{ pointer-events:auto; }
.vw-top{ position:absolute; top:56px; left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; }
.vw-top .icbtn{ background:rgba(255,255,255,.12); color:#fff; backdrop-filter:blur(12px); }
.vw-count{ font-family:var(--font-mono); font-size:13px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.12); backdrop-filter:blur(12px); }
.vw-cap{ position:absolute; left:20px; right:20px; bottom:58px; }
.vw-cap p{ font-size:14.5px; line-height:1.65; color:rgba(255,255,255,.88); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.vw-cap small{ display:block; margin-top:6px; font-size:12px; color:rgba(255,255,255,.5); }
.vw-dots{ display:flex; gap:5px; justify-content:center; margin-top:14px; }
.vw-dots i{ width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,.3); transition:all var(--dur) var(--ease-spring); }
.vw-dots i.on{ width:16px; background:#fff; }

/* ============================== 关于 ============================== */
.ab-hero{ position:relative; padding:18px 20px 8px; }
.ab-hero .beam{ position:absolute; left:-40px; right:-40px; top:-120px; height:420px; pointer-events:none; background:radial-gradient(50% 44% at 26% 40%, color-mix(in oklab, var(--primary) 24%, transparent), transparent 70%); }
.ab-av{ position:relative; width:84px; height:84px; border-radius:26px; overflow:hidden; box-shadow:0 18px 30px -14px rgba(0,40,120,.7), 0 0 0 .5px rgba(255,255,255,.14); }
.ab-name{ position:relative; margin-top:18px; font-family:var(--font-serif); font-size:32px; font-weight:900; letter-spacing:.01em; }
.ab-handle{ position:relative; margin-top:2px; font-size:14px; color:var(--text-3); }

.mod-h{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-3); margin-bottom:14px; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); }

.skills{ display:flex; flex-direction:column; gap:14px; }

.yearbar i{ position:absolute; inset:0 auto 0 0; width:72.6%; border-radius:3px; background:linear-gradient(90deg, var(--accent-red), var(--accent-yellow) 50%, var(--accent-blue)); }
.yearlab{ display:flex; justify-content:space-between; margin-top:8px; font-size:11.5px; color:var(--text-3); font-family:var(--font-mono); }
.ab-list{ margin:22px 16px 0; }

/* ============================== 底栏 V1：悬浮玻璃胶囊 ============================== */
.tabwrap{ position:absolute; z-index:25; left:0; right:0; bottom:0; height:120px; pointer-events:none; transform:translateY(calc(var(--push) * 150px)); }
.tabwrap > *{ pointer-events:auto; }
.tb1,.tb2{ display:none; }
body.bar-v1 .tb1{ display:flex; } body.bar-v2 .tb2{ display:flex; }
.tabwrap.swap > *{ animation:barIn .55s var(--ease-spring); }
@keyframes barIn{ from{ opacity:0; transform:translateY(30px) scale(.94); } }
.tb1{ position:absolute; left:0; right:0; bottom:24px; justify-content:center; align-items:center; gap:10px; }
/* 落地：bottom: max(12px, calc(env(safe-area-inset-bottom) - 10px)) —— 演示按 34px 安全区换算为 24px */
.tb1-cap{
  --pad:5px; position:relative; display:grid; grid-template-columns:repeat(var(--n), 1fr);
  width:298px; height:64px; padding:var(--pad); border-radius:999px;
  transition:width .5s var(--ease-spring), height .5s var(--ease-spring);
  background:var(--glass); backdrop-filter:blur(24px) saturate(190%); -webkit-backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 0 0 .5px var(--glass-line), inset 0 1px 0 var(--glass-hi), 0 16px 34px -14px rgba(0,4,16,.7), 0 2px 6px -2px rgba(0,4,16,.3);
}
.screen[data-mode=light] .tb1-cap,.screen[data-mode=light] .tb1-search{ box-shadow:inset 0 0 0 .5px var(--glass-line), inset 0 1px 0 var(--glass-hi), 0 16px 30px -14px rgba(20,40,90,.35), 0 2px 6px -2px rgba(20,40,90,.12); }
.tb1-pill{
  position:absolute; top:var(--pad); bottom:var(--pad); border-radius:999px;
  left:calc(var(--pad) + (100% - 2 * var(--pad)) * var(--i) / var(--n));
  right:calc(var(--pad) + (100% - 2 * var(--pad)) * (var(--n) - 1 - var(--i)) / var(--n));
  background:linear-gradient(180deg, color-mix(in oklab, var(--primary) 88%, white), var(--primary) 50%, var(--primary-deep));
  box-shadow:0 8px 18px -6px var(--glow), inset 0 1px 0 rgba(255,255,255,.3);
  /* morph：前缘先走（快），后缘跟上（慢 + 延迟），形成拉伸的液滴感 */
  transition:left .46s var(--ease-spring) .05s, right .3s var(--ease-out);
}
.tb1-cap.to-l .tb1-pill{ transition:left .3s var(--ease-out), right .46s var(--ease-spring) .05s; }
.tb1-it{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:999px; color:var(--text-2); --cut:var(--bg); transition:color var(--dur) var(--ease-out); }
.tb1-it span{ font-size:10.5px; font-weight:500; line-height:1; max-height:12px; overflow:hidden; transition:max-height .4s var(--ease-out), opacity .3s; }
.tb1-it.on{ color:var(--on-primary); --cut:var(--primary); }
.tb1-it.on .ic .f{ fill:currentColor; } .tb1-it.on .ic .d{ stroke:var(--cut); }
.tb1-it.pop .ic{ animation:pop .5s var(--ease-spring); }
@keyframes pop{ 0%{ transform:scale(1); } 25%{ transform:scale(.78) translateY(1px); } 60%{ transform:scale(1.14) translateY(-2px); } 100%{ transform:none; } }
.tb1-search{
  width:64px; height:64px; border-radius:50%; display:grid; place-items:center; color:var(--text);
  background:var(--glass); backdrop-filter:blur(24px) saturate(190%); -webkit-backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 0 0 .5px var(--glass-line), inset 0 1px 0 var(--glass-hi), 0 16px 34px -14px rgba(0,4,16,.7);
  transition:width .5s var(--ease-spring), height .5s var(--ease-spring), transform var(--dur-fast) var(--ease-spring);
}
/* 下滑收缩：只剩图标 */
.stage.bar-min .tb1-cap{ width:216px; height:50px; }
.stage.bar-min .tb1-it span{ max-height:0; opacity:0; }
.stage.bar-min .tb1-search{ width:50px; height:50px; }
.tb1-cap.admin{ width:330px; }
.stage.bar-min .tb1-cap.admin{ width:270px; }
.tb1 .fab-slot{ position:relative; z-index:2; display:grid; place-items:center; }
.tb1 .fab{ width:50px; height:50px; }
.stage.bar-min .tb1 .fab{ width:40px; height:40px; }

/* ============================== 底栏 V2：贴底全宽 ============================== */
.tb2{
  position:absolute; left:0; right:0; bottom:0; height:calc(52px + var(--safe-bottom)); padding:0 6px var(--safe-bottom);
  /* 落地：padding-bottom: env(safe-area-inset-bottom); height: calc(52px + env(safe-area-inset-bottom)) */
  background:var(--glass-2); backdrop-filter:blur(26px) saturate(190%); -webkit-backdrop-filter:blur(26px) saturate(190%);
  box-shadow:0 -.5px 0 var(--line-2);
}
.tb2-it{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding-top:6px; color:var(--text-3); --cut:var(--glass-2); }
.screen[data-mode=dark] .tb2-it{ --cut:#0e1626; } .screen[data-mode=light] .tb2-it{ --cut:#f4f6fa; }
.tb2-it span{ font-size:10.5px; font-weight:500; }
.tb2-it.on{ color:var(--ink); }
.tb2-it.on .ic .f{ fill:currentColor; } .tb2-it.on .ic .d{ stroke:var(--cut); }
.tb2-it.pop .ic{ animation:pop2 .55s var(--ease-spring); }
@keyframes pop2{ 0%{ transform:none; } 30%{ transform:scale(.8); } 65%{ transform:scale(1.16) translateY(-3px); } 100%{ transform:none; } }
.tb2 .fab-slot{ flex:1; display:grid; place-items:center; }
.tb2 .fab{ width:58px; height:58px; margin-top:-26px; box-shadow:0 0 0 5px var(--bg), 0 12px 24px -8px var(--glow); }

/* 凸起写作按钮 */
.fab{ border-radius:50%; display:grid; place-items:center; color:var(--on-primary);
  background:radial-gradient(circle at 35% 25%, color-mix(in oklab, var(--primary) 70%, white), var(--primary) 55%, var(--primary-deep));
  box-shadow:0 10px 22px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.35);
  transition:width .5s var(--ease-spring), height .5s var(--ease-spring), transform var(--dur-fast) var(--ease-spring); }
.fab .ic{ width:26px; height:26px; stroke-width:2; transition:transform .45s var(--ease-spring); }
.screen.as-open .fab .ic{ transform:rotate(135deg); }

/* ============================== 搜索（全屏覆盖） ============================== */
.search{ position:absolute; z-index:30; inset:0; visibility:hidden; pointer-events:none; }
.search.on{ visibility:visible; pointer-events:auto; }
.sr-bg{ position:absolute; inset:0; background:color-mix(in oklab, var(--bg) 84%, transparent); backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%); opacity:0; transition:opacity .4s var(--ease-out); }
.search.on .sr-bg{ opacity:1; }
.sr-head{ position:absolute; top:56px; left:16px; right:16px; display:flex; align-items:center; gap:12px;
  opacity:0; transform:translateY(560px) scale(.6); transform-origin:right center; transition:transform .55s var(--ease-spring), opacity .25s; }
.search.on .sr-head{ opacity:1; transform:none; }
.sr-field{ flex:1; display:flex; align-items:center; gap:8px; height:44px; padding:0 12px; border-radius:14px; background:var(--fill-2); color:var(--text-3); }
.sr-field input{ flex:1; min-width:0; font-size:16px; color:var(--text); caret-color:var(--primary); }
.sr-field input::placeholder{ color:var(--text-3); }
.sr-clear{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:var(--text-3); color:var(--bg); opacity:0; transition:opacity var(--dur-fast); }
.sr-clear .ic{ width:12px; height:12px; stroke-width:2.4; }
.search.has-q .sr-clear{ opacity:1; }
.sr-cancel{ font-size:16px; color:var(--ink); }
.sr-body{ position:absolute; top:112px; left:0; right:0; bottom:0; overflow-y:auto; scrollbar-width:none; padding:6px 0 60px; opacity:0; transform:translateY(12px); transition:opacity .35s var(--ease-out) .1s, transform .45s var(--ease-out) .1s; }
.search.on .sr-body{ opacity:1; transform:none; }
.sr-h{ display:flex; align-items:baseline; padding:14px 20px 8px; font-size:13px; font-weight:600; color:var(--text-3); letter-spacing:.04em; }
.sr-h button{ margin-left:auto; font-size:13px; font-weight:400; color:var(--ink); }
.sr-recent{ position:relative; width:100%; display:flex; align-items:center; gap:12px; height:48px; padding:0 20px; font-size:15.5px; text-align:left; }
.sr-recent .ic{ color:var(--text-3); width:18px; height:18px; }
.sr-recent span{ flex:1; }
.sr-recent + .sr-recent::before{ content:""; position:absolute; top:0; left:50px; right:0; height:.5px; background:var(--line); }
.sr-recent:active{ background:var(--fill); }
.sr-chips{ display:flex; flex-wrap:wrap; gap:8px; padding:4px 20px; }
.search mark{ background:none; color:var(--ink); font-weight:700; box-shadow:inset 0 -.35em 0 var(--soft); }
.sr-th{ width:100%; display:block; padding:12px 20px; text-align:left; font-size:14.5px; line-height:1.65; position:relative; }

/* =====================================================================
   交互工具
   ===================================================================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let suppressUntil = 0;
document.addEventListener('click', e => { if(performance.now() < suppressUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
const suppressClick = () => { suppressUntil = performance.now() + 60; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rubber = (x, d = 60) => d * (1 - 1 / (x / d * .55 + 1)); // 橡皮筋阻尼

/* 通用拖拽：锁定主轴 + 速度采样 */
function drag(el, o){
  el.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    const ctx = o.down(e); if(!ctx) return;
    if(o.stop) e.stopPropagation();
    const x0 = e.clientX, y0 = e.clientY; let lock = null; const hist = [{ t:performance.now(), x:x0, y:y0 }];
    const mv = ev => {
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if(!lock){
        if(Math.hypot(dx, dy) < 6) return;
        lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if(o.axis && o.axis !== lock){ off(); return; }
        o.begin && o.begin(ctx);
      }
      hist.push({ t:performance.now(), x:ev.clientX, y:ev.clientY }); if(hist.length > 6) hist.shift();
      o.move(ctx, dx, dy, ev);
    };
    const up = ev => {
      off(); if(!lock) return;
      const a = hist[0], b = hist[hist.length - 1], dt = Math.max(16, b.t - a.t);
      o.end(ctx, (b.x - a.x) / dt, (b.y - a.y) / dt, ev.clientX - x0, ev.clientY - y0);
      suppressClick();
    };
    const off = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
/* 鼠标拖动横向滚动容器（触屏走原生） */
function dragScroll(el){
  el.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse') return; e.stopPropagation();
    const x0 = e.clientX, s0 = el.scrollLeft; let moved = false; el.style.scrollSnapType = 'none';
    const mv = ev => { const dx = ev.clientX - x0; if(Math.abs(dx) > 4) moved = true; el.scrollLeft = s0 - dx; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); el.style.scrollSnapType = ''; if(moved) suppressClick(); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}
/* 主题切换：View Transition 圆形扩散 */
function reveal(el, x, y, fn){
  if(!document.startViewTransition || RM.matches){ fn(); return; }
  const root = document.documentElement, isRoot = el === root;
  const r = isRoot ? { left:0, top:0, width:innerWidth, height:innerHeight } : el.getBoundingClientRect();
  const cx = x - r.left, cy = y - r.top;
  root.style.setProperty('--vx', cx + 'px'); root.style.setProperty('--vy', cy + 'px');
  root.style.setProperty('--vr', Math.hypot(Math.max(cx, r.width - cx), Math.max(cy, r.height - cy)) + 'px');
  if(!isRoot) el.style.viewTransitionName = 'reveal'; else root.classList.add('vt-root');
  const t = document.startViewTransition(fn);
  t.finished.finally(() => { el.style.viewTransitionName = ''; root.classList.remove('vt-root'); });
}

      end:(c, vx, vy, dx, dy) => {
        v.classList.remove('drag');
        if(c.ax === 'x'){ let k = this.vw.i; if(vx < -.3 || dx < -120) k++; else if(vx > .3 || dx > 120) k--; this.vwGo(clamp(k, 0, this.vw.list.length - 1)); }
        else if(dy > 110 || vy > .6) this.closeViewer();
        else { const img = this.curImg(); img.classList.add('anim'); img.style.transform = ''; v.style.setProperty('--vbg', 1); }
      } });
  }
  curImg(){ return this.q('.vw-track').children[this.vw.i].firstElementChild; }
  openViewer(list, i, srcs){
    const v = this.q('.viewer'), track = v.querySelector('.vw-track');
    this.vw = { list, i, srcs }; this.viewerOn = true;
    track.innerHTML = list.map(m => `<div class="vw-slide"><span class="vw-img ph ph${m.im}"></span></div>`).join('');
    v.querySelector('.vw-dots').innerHTML = list.map(() => '<i></i>').join('');
    track.classList.remove('anim'); track.style.transform = `translateX(${-i * 390}px)`;
    v.style.setProperty('--vbg', 1); v.classList.add('on'); this.vwGo(i, true);
    const img = this.curImg(), f = this.flipFrom(srcs[i], img);
    if(f){ img.classList.remove('anim'); img.style.transform = f; img.style.borderRadius = '40px'; void img.offsetWidth; img.classList.add('anim'); img.style.transform = ''; img.style.borderRadius = ''; }
    this.updateTone();
  }
  flipFrom(src, img){
    if(!src) return null; const r = src.getBoundingClientRect(), t = img.getBoundingClientRect();
    if(!r.width) return null;
    return `translate(${r.left - t.left}px, ${r.top - t.top}px) scale(${r.width / t.width}, ${r.height / t.height})`;
  }
  vwGo(k, instant){
    const v = this.q('.viewer'), track = v.querySelector('.vw-track'), m = this.vw.list[k];
    this.vw.i = k; if(!instant) track.classList.add('anim'); track.style.transform = `translateX(${-k * 390}px)`;
    v.querySelector('.vw-count').textContent = `${k + 1} / ${this.vw.list.length}`;
    const t = THOUGHTS[m.ti]; v.querySelector('.vw-cap p').textContent = plain(t.text); v.querySelector('.vw-cap small').textContent = `BeaconCat · ${t.date} · #${t.mood}`;
    v.querySelectorAll('.vw-dots i').forEach((d, j) => d.classList.toggle('on', j === k));
  }
  closeViewer(){
    const v = this.q('.viewer'), img = this.curImg(), src = this.vw.srcs[this.vw.i];
    const sr = src && src.getBoundingClientRect(), vis = sr && sr.width && sr.top > 60 && sr.bottom < 800;
    img.classList.add('anim');
    if(vis){ const cur = img.style.transform; img.style.transform = ''; const f = this.flipFrom(src, img); img.style.transform = cur; void img.offsetWidth; img.style.transform = f; img.style.borderRadius = '40px'; }
    else { img.style.transform = 'scale(.85)'; img.style.opacity = '0'; }
    v.style.setProperty('--vbg', 0); this.viewerOn = false; this.updateTone();
    setTimeout(() => { v.classList.remove('on'); img.style.cssText = ''; }, 450);
  }
  /* ---------- 搜索 ---------- */
  initSearch(){
    const inp = this.q('.search input');
    inp.addEventListener('input', () => this.renderSearch(inp.value));
  }
  openSearch(q = '', focus = true){
    const s = this.q('.search'), inp = s.querySelector('input'); inp.value = q; this.renderSearch(q);
    s.classList.add('on'); if(focus) setTimeout(() => inp.focus({ preventScroll:true }), 350);
  }
  closeSearch(){ const s = this.q('.search'); s.classList.remove('on'); s.querySelector('input').blur(); }
  renderSearch(q){
    const s = this.q('.search'), body = s.querySelector('.sr-body'); q = q.trim(); s.classList.toggle('has-q', !!q);
    if(!q){
      body.innerHTML = `<div class="sr-h">最近搜索<button data-act="sr-clearall">清除</button></div>
        ${['主题色盘','APIKey','九宫格','Markdown 代码块'].map(r => `<button class="sr-recent tap" data-act="sr-q" data-v="${r}">${ic('clock')}<span>${r}</span>${ic('chev','chev')}</button>`).join('')}
        <div class="sr-h">标签</div><div class="sr-chips">${TAGS.slice(0,6).map(([t]) => `<button class="chip tap" data-act="sr-q" data-v="${t}"># ${t}</button>`).join('')}</div>
        <div class="sr-h">推荐阅读</div><div class="rows sr-res">${ARTICLES.slice(2).map(arow).join('')}</div>`;
      return;
    }
    const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), re = new RegExp(esc, 'gi'), mk = t => t.replace(re, m => `<mark>${m}</mark>`);
    const as = ARTICLES.filter(a => re.test(a.title + a.excerpt + a.tag + a.body.flat(3).join('')) && (re.lastIndex = 0, true));
    const ts = THOUGHTS.map((t, i) => ({ t, i })).filter(({ t }) => (re.lastIndex = 0, re.test(plain(t.text) + t.mood)));
    const tg = TAGS.filter(([t]) => (re.lastIndex = 0, re.test(t)));
    if(!as.length && !ts.length && !tg.length){
      body.innerHTML = `<div class="sr-empty"><div class="ring">${ic('search')}</div><b>没有找到「${q}」</b><p>换个关键词，或者试试<br><button class="mood" data-act="sr-q" data-v="主题" style="font-size:13.5px">主题</button>、<button class="mood" data-act="sr-q" data-v="API" style="font-size:13.5px">API</button>、<button class="mood" data-act="sr-q" data-v="九宫格" style="font-size:13.5px">九宫格</button></p></div>`; return;
    }
    body.innerHTML = (tg.length ? `<div class="sr-h">标签</div><div class="sr-chips">${tg.map(([t,n]) => `<button class="chip tap" data-act="tagjump" data-v="${t}"># ${mk(t)}<em>${n}</em></button>`).join('')}</div>` : '')
      + (as.length ? `<div class="sr-h">文章 · ${as.length}</div><div class="rows sr-res">${as.map(a => `<button class="arow tap" data-act="open" data-v="${a.id}"><div class="rt"><div class="meta"><em>${a.tag}</em> · ${a.md}</div><b>${mk(a.title)}</b><span class="ex">${mk(a.excerpt)}</span></div><div class="thumb">${COVER[a.cover]}</div></button>`).join('')}</div>` : '')
      + (ts.length ? `<div class="sr-h">随想 · ${ts.length}</div>${ts.map(({ t }) => `<button class="sr-th tap" data-act="tab" data-v="thoughts">${mk(plain(t.text))}<small>${t.date} · #${t.mood}</small></button>`).join('')}` : '');
  }
  /* ---------- 灵动岛提示 ---------- */
  island(text, sub = ''){
    const is = this.q('.island'); is.querySelector('.isl-t').innerHTML = text + (sub ? `<small>${sub}</small>` : '');
    is.classList.add('wide'); clearTimeout(this.isT); this.isT = setTimeout(() => is.classList.remove('wide'), 2200);
  }
  /* ---------- 点击路由 ---------- */
  onClick(e){
    const b = e.target.closest('[data-act]'); if(!b || !this.el.contains(b)) return;
    const act = b.dataset.act, v = b.dataset.v;
    switch(act){
      case 'tab':
        if(this.drawerP > .5) this.setDrawer(0);
        if(this.q('.search').classList.contains('on')) this.closeSearch();
        if(this.push) this.back();
        this.setTab(v); break;
      case 'drawer': this.setDrawer(1); break;
      case 'drawer-close': if(this.el.classList.contains('as-open')){ this.closeAS(); break; } this.setDrawer(0); break;
      case 'mode': case 'palette': {
        const m = act === 'mode' ? v : this.mode, p = act === 'palette' ? v : this.palette;
        if(m === this.mode && p === this.palette) return;
        reveal(this.el, e.clientX, e.clientY, () => this.setTheme(m, p));
        if(act === 'palette') setTimeout(() => this.island(`${PRESETS[p].name}季色盘`, m === 'dark' ? '深色' : '浅色'), 350);
        break; }
      case 'open': if(this.q('.search').classList.contains('on')) this.closeSearch(); this.openArticle(v); break;
      case 'back': this.back(); break;
      case 'toc': this.openToc(); break;
      case 'toc-go': {
        const s = this.q('.app-v .detail .dt-scroll'), h = this.q(`.app-v .detail .prose h2[data-h="${v}"]`);
        this.closeSheet(); setTimeout(() => s.scrollTo({ top:h.offsetTop - 110, behavior:'smooth' }), 120); break; }
      case 'top': this.q('.app-v .detail .dt-scroll').scrollTo({ top:0, behavior:'smooth' }); break;
      case 'bigtype': this.el.classList.toggle('big-type'); this.island('字号', this.el.classList.contains('big-type') ? '大' : '标准'); break;
      case 'sheet-close': this.closeSheet(); if(this.el.classList.contains('as-open')) this.el.classList.remove('as-open'); break;
      case 'filter': {
        b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
        b.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
        renderArticleList(this.q('.al'), v); break; }
      case 'tagjump': {
        this.setDrawer(0); if(this.q('.search').classList.contains('on')) this.closeSearch();
        if(this.role !== 'visitor') this.setRole('visitor');
        const tag = ARTICLES.some(a => a.tag === v) ? v : '全部';
        if(v === '随想') { this.setTab('thoughts'); break; }
        this.setTab('articles');
        this.qa('.app-v .chips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === tag));
        renderArticleList(this.q('.al'), tag); break; }
      case 'seg': {
        const seg = b.parentElement, page = b.closest('.page'), k = +v, old = +seg.style.getPropertyValue('--i');
        seg.style.setProperty('--i', k); seg.querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === k));
        page.querySelectorAll('.th-view').forEach(x => { const on = +x.dataset.view === k; x.hidden = !on; x.classList.remove('in-l', 'in-r'); if(on && k !== old){ void x.offsetWidth; x.classList.add(k > old ? 'in-r' : 'in-l'); } });
        break; }
      case 'img': {
        const ti = b.dataset.t, i = +b.dataset.i;
        let list, srcs;
        if(ti === 'all'){ list = THOUGHTS.flatMap((t, t2) => t.imgs.map(im => ({ im, ti:t2 }))); srcs = this.qa('.app-v .mg button'); }
        else { list = THOUGHTS[+ti].imgs.map(im => ({ im, ti:+ti })); srcs = [...b.parentElement.children]; }
        this.openViewer(list, i, srcs); break; }
      case 'viewer-close': this.closeViewer(); break;
      case 'like': { b.classList.toggle('liked'); const n = b.querySelector('span'); n.textContent = +n.textContent + (b.classList.contains('liked') ? 1 : -1); break; }
      case 'search': this.openSearch(''); break;
      case 'search-close': this.closeSearch(); break;
      case 'sr-clear': e.preventDefault(); this.q('.search input').value = ''; this.renderSearch(''); break;
      case 'sr-clearall': this.qa('.sr-recent').forEach((r, k) => { r.style.transition = `opacity .25s ${k * .04}s, transform .35s ${k * .04}s`; r.style.opacity = 0; r.style.transform = 'translateX(-20px)'; }); break;
      case 'sr-q': this.q('.search input').value = v; this.renderSearch(v); break;
      case 'rss': this.island('已复制 RSS 地址', '/feed'); break;
      case 'copy-link': this.island('链接已复制'); break;
      case 'island': this.island(v); break;
      case 'role': this.setDrawer(0); setTimeout(() => this.setRole(v), this.drawerP ? 0 : 0); break;
      case 'fab': this.el.classList.toggle('as-open'); break;
      case 'write-thought': this.closeAS(); setTimeout(() => this.openSheet('composer', 'half'), 180); break;
      case 'write-article': this.closeAS(); this.el.classList.add('pushed'); this.push = 1; this.el.style.setProperty('--push', 1); break;
      case 'publish-article': this.back(); this.island('文章已发布', '底栏的两种答案'); break;
      case 'upload': this.closeAS(); this.fakeUpload(); break;
      case 'mood': b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); break;
      case 'post': this.publishThought(); break;
    }
  }
  closeAS(){ if(!this.el.classList.contains('as-open')) return; this.el.classList.remove('as-open'); }
  publishThought(){
    const t = this.q('.cp-body textarea'), txt = t.value.trim(); if(!txt) return;
    this.closeSheet(); this.setTab('content');
    const page = this.q('.app-a .page[data-page="content"]'), seg = page.querySelector('.segc');
    seg.querySelectorAll('button')[1].click();
    const box = page.querySelector('.c-thoughts');
    box.insertAdjacentHTML('afterbegin', `<button class="crow tap fresh"><div class="thumb"><span class="ph ph6" style="position:absolute;inset:0"></span></div><div class="ct"><b>${txt.replace(/</g,'&lt;')}</b><small><span class="st pub">已发布</span>刚刚 · 2 图</small></div></button>`);
    const c = page.querySelector('.tcount'); c.textContent = +c.textContent + 1;
    t.value = ''; this.onCompose();
    setTimeout(() => this.island('随想已发布', '已推送到 RSS'), 300);
  }
  fakeUpload(){
    this.setTab('media');
    const g = this.q('.app-a .mgrid');
    g.insertAdjacentHTML('afterbegin', [7,11,3].map(i => `<div class="m up"><span class="ph ph${i}"></span><div class="prog"><svg viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="13"/><circle class="fg" cx="15" cy="15" r="13"/></svg></div><small>压缩中</small></div>`).join(''));
    [...g.querySelectorAll('.m.up:not(.done)')].forEach((m, k) => {
      const fg = m.querySelector('.fg'), dur = 1400 + k * 500, t0 = performance.now();
      const tick = now => { const p = clamp((now - t0) / dur, 0, 1); fg.style.strokeDashoffset = (81.7 * (1 - p)).toFixed(1);
        if(p < 1) requestAnimationFrame(tick); else { m.classList.add('done'); m.querySelector('small').textContent = [88, 142, 64][k] + ' KB'; if(k === 2) this.island('3 张图片已压缩', '节省 64%'); } };
      requestAnimationFrame(tick);
    });
  }
}

/* =====================================================================
   画布：布局 + 全局开关
   ===================================================================== */
const PHONES = [
  { row:0, n:'01', t:'首页', s:'横滑封面 · 最新 · 随想预览', tab:'home' },
  { row:0, n:'02', t:'文章', s:'大标题折叠 · 标签 chips', tab:'articles' },
  { row:0, n:'03', t:'文章详情', s:'沉浸阅读 · 进度 · 目录 sheet', tab:'articles', detail:'theme', scroll:760 },
  { row:0, n:'04', t:'随想', s:'信息流 / 媒体 · 全屏查看器', tab:'thoughts' },
  { row:0, n:'05', t:'关于', s:'竖向模块', tab:'about' },
  { row:1, n:'06', t:'侧边抽屉', s:'卡片堆叠 · 可拖动跟手', tab:'home', drawer:true },
  { row:1, n:'07', t:'搜索', s:'全屏覆盖 · 混合结果', tab:'home', search:'主题' },
  { row:1, n:'08', t:'后台 · 概览', s:'凸起写作键 → action sheet', role:'admin', tab:'overview' },
  { row:1, n:'09', t:'后台 · 写随想', s:'半屏 / 全屏 detent', role:'admin', tab:'content', composer:true },
];
document.querySelector('[data-logo]').innerHTML = LOGO;
document.querySelector('.gdots').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button data-v="${k}" style="--c:${p.primary}" title="${p.name}" class="${k === 'winter' ? 'on' : ''}"></button>`).join('');
PHONES.forEach(cfg => {
  const cell = document.createElement('figure'); cell.className = 'cell';
  cell.innerHTML = `<figcaption class="cap"><b>${cfg.n}</b><strong>${cfg.t}</strong><span>${cfg.s}</span></figcaption>`;
  document.querySelector(`.phones[data-row="${cfg.row}"]`).appendChild(cell);
  new Phone(cell, cfg);
});
function syncSeg(seg){ const on = seg.querySelector('button.on'), th = seg.querySelector('.th'); if(on && th){ th.style.left = on.offsetLeft + 'px'; th.style.width = on.offsetWidth + 'px'; } }
document.querySelectorAll('.gseg').forEach(syncSeg);
document.fonts && document.fonts.ready.then(() => { document.querySelectorAll('.gseg').forEach(syncSeg); phones.forEach(p => p.measure()); });
document.querySelector('.top').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const g = b.closest('[data-g]').dataset.g, v = b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  if(g === 'bar'){
    G.bar = v; syncSeg(b.parentElement);
    document.body.classList.toggle('bar-v1', v === 'v1'); document.body.classList.toggle('bar-v2', v === 'v2');
    document.querySelectorAll('.tabwrap').forEach(t => { t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap'); });
  } else {
    syncSeg(b.parentElement);
    if(g === 'mode') G.mode = v; else G.palette = v;
    reveal(document.documentElement, e.clientX, e.clientY, () => {
      document.documentElement.dataset.mode = G.mode;
      document.documentElement.style.setProperty('--g-primary', PRESETS[G.palette].primary);
      phones.forEach(p => p.setTheme(G.mode, G.palette));
    });
  }
});
window.__phones = phones;
</script>
