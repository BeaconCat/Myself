// 语言图例联动
document.addEventListener('pointerover',e=>{const li=e.target.closest?.('.lg-leg li,.lg-bar i,.lg-ring circle');const box=e.target.closest?.('.m-body');if(!box)return;const bar=$('.lg-bar',box),ring=$('.lg-ring',box);if(!bar&&!ring)return;
  const i=li?li.dataset.i:null;if(bar){bar.classList.toggle('hov',i!=null);$$('i',bar).forEach(x=>x.classList.toggle('on',x.dataset.i===i))}
  if(ring)$$('circle',ring).forEach(x=>x.style.opacity=i==null||x.dataset.i===i?1:.25);
  $$('.lg-leg li',box).forEach(x=>x.classList.toggle('on',x.dataset.i===i))});
// 地点列表悬停
document.addEventListener('pointerover',e=>{const li=e.target.closest?.('.pl-list li');if(!li)return;const pl=li.closest('[data-pl]');$$('.pl-list li',pl).forEach(x=>x.classList.toggle('on',x===li));$$('.c',pl).forEach(c=>c.setAttribute('r',c.dataset.i===li.dataset.i?'.95':'.62'))});

function toast(msg){const t=$('#toast');t.innerHTML=I.ok+msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

// 语录轮播
function setQuote(qr,i){const items=D.quotes.items;i=(i+items.length)%items.length;qr.classList.add('out');
  setTimeout(()=>{$('blockquote',qr).textContent=items[i].text;$('cite',qr).textContent='— '+items[i].from;qr.dataset.i=i;qr.classList.remove('out');
    $$('.pips button',qr).forEach((b,k)=>{b.className=k===i?'on':k<i?'done':''});const n=qr.closest('.m')?.querySelector('[data-qn]');if(n)n.textContent=String(i+1).padStart(2,'0')},RM?0:380)}
document.addEventListener('animationend',e=>{if(e.animationName==='fill'){const qr=e.target.closest('[data-qr]');if(qr)setQuote(qr,+qr.dataset.i+1)}},true);

// 点击分发
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='faq'){const li=a.parentElement;const open=!li.classList.contains('open');$$('li',li.parentElement).forEach(x=>{x.classList.remove('open');$('button',x).setAttribute('aria-expanded','false')});if(open){li.classList.add('open');a.setAttribute('aria-expanded','true')}}
  if(act==='play'){const ls=a.closest('[data-ls]');const on=ls.classList.toggle('playing');a.innerHTML=on?I.pause:I.play}
  if(act==='book'){const bs=a.closest('[data-bs]');$$('.spine',bs).forEach(s=>s.classList.toggle('on',s===a));$('.bs-card',bs).innerHTML=bookCard(D.bookshelf.items[+a.dataset.i])}
  if(act==='fav'){const f=a.closest('[data-fav]');$$('.seg button',f).forEach(b=>b.classList.toggle('on',b===a));$('.fv-list',f).innerHTML=favList(D.favorites.groups[+a.dataset.i])}
  if(act==='year'){const m=a.closest('.m');$$('[data-act=year]',m).forEach(b=>b.classList.toggle('on',b===a));const box=$('[data-yr]',m);box.innerHTML=yearBody(D.year.years[a.dataset.y]);requestAnimationFrame(()=>requestAnimationFrame(()=>activate(box)))}
  if(act==='q'){setQuote(a.closest('[data-qr]'),+a.dataset.i)}
  if(act==='qnext'||act==='qprev'){const qr=a.closest('[data-qr]');setQuote(qr,+qr.dataset.i+(act==='qnext'?1:-1))}
  if(act==='copy'){navigator.clipboard?.writeText(a.dataset.v).catch(()=>{});a.classList.add('ok');a.innerHTML=I.ok+'已复制';toast('邮箱已复制');setTimeout(()=>{a.classList.remove('ok');a.innerHTML=I.copy+'复制'},1800)}
  if(act==='like'){a.classList.toggle('on');const s=$('span',a);s.textContent=+s.textContent+(a.classList.contains('on')?1:-1)}
  if(act==='status-cycle'){const m=a.closest('.m');const ss=$('.ss',m);const i=(+ss.dataset.si+1)%3;ss.dataset.si=i;const s=D.status.states[i];$('.ss-ring',ss).style.setProperty('--sc',s.color);$('.ss-state',ss).textContent=s.label;$('.ss-sub',ss).textContent=s.sub}
  if(act==='lb'){openLB(a)}
});
document.addEventListener('input',e=>{const f=e.target.closest('[data-gbf]');if(f)$('.cnt',f).textContent=e.target.value.length+'/120'});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-gbf]');if(!f)return;e.preventDefault();const inp=$('input',f);const v=inp.value.trim();if(!v)return;
  const wall=$('.gb-wall',f.parentElement);wall.insertAdjacentHTML('afterbegin',noteHTML({name:'访客',c:'var(--primary)',at:'刚刚',text:v,likes:0},true));inp.value='';$('.cnt',f).textContent='0/120';toast('留言已提交，审核后公开')});

// Lightbox（FLIP：从缩略图飞入）
let LB={list:null,i:0,src:null};
function lbRect(){const vw=innerWidth,vh=innerHeight;const w=Math.min(vw*.72,1100),h=Math.min(w*.62,vh*.72);return {left:(vw-w)/2,top:(vh-h)/2-24,width:w,height:h}}
function place(el,r){Object.assign(el.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'})}
function openLB(btn){const g=btn.closest('[data-gal]');LB={list:GAL[g.dataset.gal],i:+btn.dataset.i,src:btn,g};const lb=$('#lb'),img=$('#lbImg');
  showLB();img.style.transition='none';place(img,btn.getBoundingClientRect());img.style.borderRadius='14px';lb.classList.add('on');lb.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{img.style.transition='';place(img,lbRect());img.style.borderRadius='18px'}))}
function showLB(){const im=LB.list[LB.i];$('#lbImg .scene').className='scene '+im.sc;$('#lbT').textContent=im.title;$('#lbM').textContent=`${im.place} · ${im.date}  ·  ${String(LB.i+1).padStart(2,'0')} / ${String(LB.list.length).padStart(2,'0')}`}
function closeLB(){const lb=$('#lb'),img=$('#lbImg');const b=$(`[data-i="${LB.i}"]`,LB.g);if(b&&b.offsetParent)place(img,b.getBoundingClientRect());else img.style.opacity=0;lb.classList.remove('on');lb.setAttribute('aria-hidden','true');setTimeout(()=>{img.style.opacity='';img.style.transition='none';place(img,{left:-9999,top:0,width:0,height:0})},560)}
function stepLB(d){LB.i=(LB.i+d+LB.list.length)%LB.list.length;const img=$('#lbImg');img.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-d*30}px) scale(.98)`}],{duration:RM?1:180,easing:'ease-in'}).onfinish=()=>{showLB();img.animate([{opacity:0,transform:`translateX(${d*30}px) scale(.98)`},{opacity:1,transform:'none'}],{duration:RM?1:320,easing:'cubic-bezier(.2,.8,.3,1)'})}}
$('#lbX').onclick=closeLB;$('#lbPrev').onclick=()=>stepLB(-1);$('#lbNext').onclick=()=>stepLB(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB()});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')stepLB(1);if(e.key==='ArrowLeft')stepLB(-1)});

/* =====================================================================
   6. 主题：mode × palette（运行时派生），切换用 View Transition 圆形扩散
   ===================================================================== */
const PAL={spring:['#00c853','#009a40'],summer:['#ff0032','#c20026'],autumn:['#ffb300','#c98500'],winter:['#0078ff','#0056c4']};
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function applyTheme(){const r=document.documentElement,[p,pd]=PAL[r.dataset.palette];const rgb=hexRgb(p);
  r.style.setProperty('--primary',p);r.style.setProperty('--primary-deep',pd);r.style.setProperty('--p',rgb.join(' '));
  const L=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])/255;r.style.setProperty('--on-primary',L>.6?'#1a1300':'#fff');
  $$('.theme .sw').forEach(b=>b.classList.toggle('on',b.dataset.pal===r.dataset.palette))}
function switchTheme(fn,ev){const x=ev?.clientX??innerWidth-60,y=ev?.clientY??30;
  if(!document.startViewTransition||RM){fn();applyTheme();return}
  const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>{fn();applyTheme()}).ready.then(()=>{document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:700,easing:'cubic-bezier(.2,.8,.3,1)',pseudoElement:'::view-transition-new(root)'})})}
$$('.theme .sw').forEach(b=>b.onclick=e=>switchTheme(()=>document.documentElement.dataset.palette=b.dataset.pal,e));
$('#modeBtn').onclick=e=>switchTheme(()=>{const r=document.documentElement;r.dataset.mode=r.dataset.mode==='dark'?'light':'dark'},e);
const qs=new URLSearchParams(location.search);if(qs.get('mode'))document.documentElement.dataset.mode=qs.get('mode');if(PAL[qs.get('pal')])document.documentElement.dataset.palette=qs.get('pal');
applyTheme();

// 工具条
$$('.kitbar [data-go]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:RM?'auto':'smooth'}));
$('#gridBtn').onclick=()=>{$('#page').classList.toggle('show-grid');$('#gridBtn').classList.toggle('on')};
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$$('.kitbar [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===(e.target.id==='catalog'?'catalog':'top')))}),{threshold:.35});
spy.observe($('#catalog'));spy.observe($('#page'));

/* =====================================================================
   7. 组件目录
   ===================================================================== */
const TAG={new:'<i class="tag new">NEW</i>',re:'<i class="tag re">REDO</i>',mg:'<i class="tag mg">MERGE</i>'};
$('#catSide').innerHTML=GROUPS.map(g=>`<h6>${g}</h6>`+META.filter(m=>m.group===g).map(m=>`<button data-cat="${m.type}"><span class="l">${m.name}<small>${m.type}</small></span>${m.st==='new'?TAG.new:m.st==='mg'?TAG.mg:''}</button>`).join('')).join('');
const cat={type:'stats',variant:null,layout:'12'};
function hl(src){return esc(src).replace(/(\/\/.*$)|('[^']*')|\b(interface|type|extends|export|Record)\b|\b(string|number|boolean|null|true|false)\b|\b([A-Z][A-Za-z]+)\b|(\w+)(?=\??:)|(\b\d+\b)/gm,(m,c,s,k,t,T,p,n)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:t?`<span class="t">${t}</span>`:T?`<span class="t">${T}</span>`:p?`<span class="p">${p}</span>`:`<span class="n">${n}</span>`)}
function renderCat(anim=true){const m=metaOf(cat.type);const v=cat.variant??m.variants[0][0];
  const sp=m.spans;let row;
  const mk=span=>renderModule({type:m.type,span,variant:v,data:m.type==='chapter'?{no:'02',title:'做过的事',subtitle:'四条信条，三个项目，一条时间线。'}:undefined});
  if(cat.layout==='12'&&!(sp.length===1&&sp[0]===3)){const a=sp.includes(1)?1:null,b=sp.includes(2)?2:null;
    row=(a&&b)?`<div class="cap-row"><span style="grid-column:span 4">SPAN 1 · 4 栏</span><span style="grid-column:span 8">SPAN 2 · 8 栏</span></div><div class="bento">${mk(1)}${mk(2)}</div>`
      :`<div class="cap-row"><span style="grid-column:span ${a?4:8}">SPAN ${a||b} · ${a?4:8} 栏</span></div><div class="bento">${mk(a||b)}</div>`}
  else row=`<div class="cap-row"><span style="grid-column:1/-1">SPAN 3 · 12 栏</span></div><div class="bento">${mk(3)}</div>`;
  const canWide=sp.includes(3)&&!(sp.length===1);
  $('#catMain').innerHTML=`<div class="cd-head"><div><div class="cd-type"><span>type: '${m.type}'</span>${TAG[m.st]}</div><h3>${m.name}</h3><p>${m.desc}</p></div>
  <div class="cd-ctl">${m.variants.length>1?`<label>VARIANT<div class="seg">${m.variants.map(([id,l])=>`<button class="${id===v?'on':''}" data-cv="${id}">${l}</button>`).join('')}</div></label>`:''}
  ${canWide?`<label>LAYOUT<div class="seg"><button class="${cat.layout==='12'?'on':''}" data-cl="12">span 1 / 2</button><button class="${cat.layout==='3'?'on':''}" data-cl="3">span 3</button></div></label>`:''}
  <label style="color:var(--text-3)">可用 span：${sp.join(' / ')}</label></div></div>
  <div class="stage ${anim?'stage-anim':''}"><div style="position:relative">${row}</div></div>
  <div class="cd-grid"><div class="panel"><h6>DATA SCHEMA · TS<button data-act="copy" data-v="${esc(m.schema)}">${I.copy}复制</button></h6><pre class="code">${hl(m.schema)}</pre></div>
  <div class="panel"><h6>迁移与落地</h6><dl class="notes"><dt>变体</dt><dd>${m.variants.map(([id,l])=>`<code>${id}</code> ${l}`).join('，')}</dd>${m.notes.map(([k,t])=>`<dt>${k}</dt><dd>${t}</dd>`).join('')}<dt>外壳</dt><dd>${R[m.type](D[m.type]||{},{variant:v}).chrome===false?'无卡片外壳（开放排版），仍参与 reveal。':'统一 .m.card：标题宋体 17 / 内边距 28 / 圆角 22 / hover 上浮 2px + 指针高光描边。'}</dd></dl></div></div>`;
  $$('.cat-side button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat.type));
  const st=$('#catMain .stage');$$('.rv',st).forEach(el=>el.classList.add('in'));requestAnimationFrame(()=>activate(st));bindDoors(st);
}
$('#catSide').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat.type=b.dataset.cat;cat.variant=null;cat.layout='12';renderCat()});
$('#catMain').addEventListener('click',e=>{const v=e.target.closest('[data-cv]'),l=e.target.closest('[data-cl]');if(v){cat.variant=v.dataset.cv;renderCat()}if(l){cat.layout=l.dataset.cl;renderCat()}});
document.addEventListener('keydown',e=>{if($('#lb').classList.contains('on'))return;const r=$('#catalog').getBoundingClientRect();if(r.top>innerHeight*.5||r.bottom<0)return;if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'||e.target.tagName==='INPUT')return;e.preventDefault();
  const order=GROUPS.flatMap(g=>META.filter(m=>m.group===g).map(m=>m.type));let i=order.indexOf(cat.type)+(e.key==='ArrowDown'?1:-1);i=(i+order.length)%order.length;cat.type=order[i];cat.variant=null;cat.layout='12';renderCat()});
if(qs.get('cat')){cat.type=qs.get('cat');if(qs.get('v'))cat.variant=qs.get('v');if(qs.get('l'))cat.layout=qs.get('l')}
renderCat(false);
</script>
</body>
</html>
